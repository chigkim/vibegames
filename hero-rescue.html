<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hero Rescue!</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background:#1a1a2e;
  display:flex; align-items:center; justify-content:center;
  height:100vh; width:100vw; overflow:hidden;
  font-family:'Comic Sans MS','Chalkboard SE',cursive;
  touch-action:none;
  user-select:none; -webkit-user-select:none;
}
#wrap {
  position:relative;
  width:100vw; max-width:480px;
  height:100vh; max-height:760px;
  overflow:hidden;
  border-radius:12px;
  background:#000;
}
canvas { display:block; width:100%; height:100%; }
#hud {
  position:absolute; top:0; left:0; right:0;
  display:flex; justify-content:space-between;
  padding:10px 12px; pointer-events:none; z-index:10;
}
.hud-pill {
  background:rgba(0,0,0,0.6);
  border-radius:20px; padding:6px 14px;
  color:#fff; font-size:15px; font-weight:bold;
}
#mission-banner {
  position:absolute; top:52px; left:0; right:0;
  text-align:center; pointer-events:none; z-index:10;
}
#mission-text {
  display:inline-block;
  color:#fff; font-size:13px; font-weight:bold;
  padding:5px 16px; border-radius:20px;
}
#joystick-zone {
  position:absolute; bottom:22px; left:18px;
  width:120px; height:120px; z-index:20;
}
#joystick-base {
  position:absolute; inset:0;
  background:rgba(255,255,255,0.12);
  border:3px solid rgba(255,255,255,0.3);
  border-radius:60px;
}
#joystick-knob {
  position:absolute;
  width:48px; height:48px;
  border-radius:24px;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 3px 10px rgba(0,0,0,0.5);
  border:3px solid rgba(255,255,255,0.5);
}
#horn-btn {
  position:absolute; bottom:22px; right:18px;
  width:76px; height:76px;
  border-radius:38px;
  border:4px solid rgba(255,255,255,0.4);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  font-size:26px; color:#fff; z-index:20;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
}
#horn-btn div { font-size:10px; font-weight:bold; margin-top:1px; }
#overlay {
  position:absolute; inset:0;
  background:rgba(0,0,0,0.65);
  display:flex; align-items:center; justify-content:center;
  z-index:50;
}
#overlay-card {
  position:relative;
  background:#fff;
  border-radius:24px; padding:24px 28px;
  text-align:center; max-width:300px;
}
#ov-emoji { font-size:52px; line-height:1.1; }
#ov-title { font-size:21px; font-weight:bold; margin:8px 0 4px; }
#ov-sub { font-size:13px; color:#555; margin-bottom:16px; line-height:1.5; }
#ov-btn {
  color:#fff; border:none;
  border-radius:50px; padding:12px 36px;
  font-size:17px; font-family:inherit; font-weight:bold;
  cursor:pointer; display:inline-block;
}
/* Vehicle picker */
#picker {
  position:absolute; inset:0;
  background:linear-gradient(160deg,#1a237e 0%,#311b92 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:60; gap:16px; padding:20px;
}
#picker h1 { color:#fff; font-size:26px; text-shadow:0 2px 8px rgba(0,0,0,0.4); margin-bottom:8px; }
.pick-btn {
  width:240px; padding:18px 20px;
  border-radius:20px; border:none; cursor:pointer;
  display:flex; align-items:center; gap:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.35);
  font-family:inherit;
}
.pick-btn:active { transform:scale(0.96); }
.pick-icon { font-size:44px; line-height:1; }
.pick-text { text-align:left; }
.pick-text strong { display:block; font-size:18px; }
.pick-text span { font-size:12px; opacity:0.85; }
.pick-amb { background:linear-gradient(135deg,#ffffff 0%,#ffcdd2 100%); color:#b71c1c; }
.pick-fire { background:linear-gradient(135deg,#ff8a65 0%,#d32f2f 100%); color:#fff; }
.confetti {
  position:absolute; pointer-events:none;
  animation:cfall linear forwards; z-index:70;
}
@keyframes cfall {
  0%{opacity:1;transform:translateY(0) rotate(0deg)}
  100%{opacity:0;transform:translateY(110vh) rotate(720deg)}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="hud-pill" id="score-pill">⭐ 0</div>
  </div>
  <div id="mission-banner"><div id="mission-text"></div></div>
  <div id="joystick-zone">
    <div id="joystick-base"></div>
    <div id="joystick-knob"></div>
  </div>
  <div id="horn-btn"><div>🔊</div><div id="horn-label">SIREN</div></div>

  <!-- Game overlay (celebration / between rounds) -->
  <div id="overlay" style="display:none">
    <div id="overlay-card">
      <div style="position:absolute;top:8px;right:12px;font-size:11px;opacity:0.4;font-family:monospace;">v1</div>
      <div id="ov-emoji">🎉</div>
      <div id="ov-title">Great job!</div>
      <div id="ov-sub"></div>
      <div id="ov-btn">Again!</div>
    </div>
  </div>

  <!-- Vehicle picker -->
  <div id="picker">
    <h1>🚨 Hero Rescue! 🚨</h1>
    <div style="font-size:12px;opacity:0.55;margin-top:-8px;margin-bottom:4px;font-family:monospace;">v1</div>
    <button class="pick-btn pick-amb" id="btn-amb">
      <div class="pick-icon">🚑</div>
      <div class="pick-text">
        <strong>Ambulance</strong>
        <span>Pick up a sick person<br>& race to the hospital!</span>
      </div>
    </button>
    <button class="pick-btn pick-fire" id="btn-fire">
      <div class="pick-icon">🚒</div>
      <div class="pick-text">
        <strong>Fire Truck</strong>
        <span>Save the kitten in a tree<br>& take it to the vet!</span>
      </div>
    </button>
  </div>
</div>

<script>
(function(){
"use strict";

// ── Elements ──────────────────────────────────────────────────────────────────
var wrap      = document.getElementById('wrap');
var canvas    = document.getElementById('c');
var ctx       = canvas.getContext('2d');
var overlay   = document.getElementById('overlay');
var ovBtn     = document.getElementById('ov-btn');
var knob      = document.getElementById('joystick-knob');
var joyZone   = document.getElementById('joystick-zone');
var hornBtn   = document.getElementById('horn-btn');
var hornLabel = document.getElementById('horn-label');
var missionEl = document.getElementById('mission-text');
var scorePill = document.getElementById('score-pill');
var picker    = document.getElementById('picker');
var btnAmb    = document.getElementById('btn-amb');
var btnFire   = document.getElementById('btn-fire');

// ── Mode: 'ambulance' or 'firetruck' ──────────────────────────────────────────
var mode = 'ambulance';

// Configs per mode
var MODES = {
  ambulance: {
    missionColor:  'rgba(210,40,40,0.9)',
    knobColor:     '#e53935',
    hornColor:     '#e53935',
    hornGlow:      'rgba(200,0,0,0.5)',
    msg1:          '🤒 Drive to the sick house!',
    msg2:          '🏥 Race to the hospital!',
    arrowColor1:   '#FFD700',
    arrowColor2:   '#42a5f5',
    celebMsgs: [
      {e:'🎉',t:'You saved them!',   s:'You\'re an ambulance hero! 🦸'},
      {e:'⭐',t:'Amazing job!',      s:'The patient says thank you! 🥰'},
      {e:'🏆',t:'Super Driver!',     s:'Zoom zoom to the rescue! 🚀'},
      {e:'💖',t:'You\'re the best!', s:'Another life saved! 🌟'},
    ],
    nextBtn: 'Next Rescue! 🚑',
  },
  firetruck: {
    missionColor:  'rgba(220,100,0,0.92)',
    knobColor:     '#ff6f00',
    hornColor:     '#ff6f00',
    hornGlow:      'rgba(255,100,0,0.5)',
    msg1:          '🐱 Drive to the kitten in the tree!',
    msg2:          '🏥 Race to the vet!',
    arrowColor1:   '#FFD700',
    arrowColor2:   '#66BB6A',
    celebMsgs: [
      {e:'🐱',t:'Kitty is safe!',      s:'You\'re a fire truck hero! 🚒'},
      {e:'⭐',t:'Amazing rescue!',      s:'The kitten says purrr! 😸'},
      {e:'🏆',t:'Super Firefighter!',   s:'Kitty is so happy! 🐾'},
      {e:'💖',t:'You\'re the best!',    s:'Kitty loves you! 🐱❤️'},
    ],
    nextBtn: 'Next Rescue! 🚒',
  },
};

// ── Canvas ────────────────────────────────────────────────────────────────────
function resize(){
  canvas.width  = wrap.offsetWidth  || 375;
  canvas.height = wrap.offsetHeight || 667;
}
resize();
window.addEventListener('resize', resize);
function CW(){ return canvas.width; }
function CH(){ return canvas.height; }

// ── World ─────────────────────────────────────────────────────────────────────
var ROAD_W  = 160;
var WORLD_H = 3200;
var DEST1_Y = 520;        // house / big tree
var DEST2_Y = WORLD_H-520; // hospital / vet

// ── State ──────────────────────────────────────────────────────────────────────
var running=false, phase='to-dest1', score=0, flash=0, camY=0;
var AMB_W=34, AMB_H=56;
var veh = { x:0, y:200, angle:0, speed:0, hasCargo:false, invincible:0 };
var obstacles=[], trees=[], clouds=[];

// ── Joystick ──────────────────────────────────────────────────────────────────
var joy={dx:0,dy:0,active:false,tid:null};
var JR=36;
function getJoyCenter(){
  var r=joyZone.getBoundingClientRect();
  return{cx:r.left+r.width/2,cy:r.top+r.height/2};
}
joyZone.addEventListener('touchstart',function(e){
  e.preventDefault(); var t=e.changedTouches[0];
  joy.active=true; joy.tid=t.identifier;
},{passive:false});
joyZone.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier!==joy.tid) continue;
    var c=getJoyCenter();
    var dx=t.clientX-c.cx, dy=t.clientY-c.cy;
    var dist=Math.sqrt(dx*dx+dy*dy);
    var cl=Math.min(dist,JR);
    var nx=dist>0?dx/dist:0, ny=dist>0?dy/dist:0;
    joy.dx=nx*(cl/JR); joy.dy=ny*(cl/JR);
    knob.style.transform='translate(calc(-50% + '+Math.round(nx*cl)+'px),calc(-50% + '+Math.round(ny*cl)+'px))';
  }
},{passive:false});
function joyRelease(){
  joy.active=false; joy.dx=0; joy.dy=0;
  knob.style.transform='translate(-50%,-50%)';
}
joyZone.addEventListener('touchend',   function(e){joyRelease();},{passive:false});
joyZone.addEventListener('touchcancel',function(e){joyRelease();},{passive:false});
var mdown=false;
joyZone.addEventListener('mousedown',function(){mdown=true;joy.active=true;});
document.addEventListener('mousemove',function(e){
  if(!mdown) return;
  var c=getJoyCenter();
  var dx=e.clientX-c.cx, dy=e.clientY-c.cy;
  var dist=Math.sqrt(dx*dx+dy*dy), cl=Math.min(dist,JR);
  var nx=dist>0?dx/dist:0, ny=dist>0?dy/dist:0;
  joy.dx=nx*(cl/JR); joy.dy=ny*(cl/JR);
  knob.style.transform='translate(calc(-50% + '+Math.round(nx*cl)+'px),calc(-50% + '+Math.round(ny*cl)+'px))';
});
document.addEventListener('mouseup',function(){ mdown=false; joyRelease(); });

// ── Horn / Siren button ────────────────────────────────────────────────────────
hornBtn.addEventListener('touchstart',function(e){e.preventDefault();honkHorn();},{passive:false});
hornBtn.addEventListener('click',honkHorn);

// ── Overlay button ─────────────────────────────────────────────────────────────
var ovAction=null;
function handleOvBtn(){ overlay.style.display='none'; if(ovAction){ovAction();ovAction=null;} }
ovBtn.addEventListener('touchstart',function(e){e.preventDefault();handleOvBtn();},{passive:false});
ovBtn.addEventListener('click',handleOvBtn);

// ── Picker buttons ─────────────────────────────────────────────────────────────
function pickVehicle(m){
  mode=m;
  picker.style.display='none';
  applyModeStyle();
  startGame();
}
btnAmb.addEventListener('touchstart',function(e){e.preventDefault();pickVehicle('ambulance');},{passive:false});
btnAmb.addEventListener('click',function(){pickVehicle('ambulance');});
btnFire.addEventListener('touchstart',function(e){e.preventDefault();pickVehicle('firetruck');},{passive:false});
btnFire.addEventListener('click',function(){pickVehicle('firetruck');});

function applyModeStyle(){
  var cfg=MODES[mode];
  knob.style.background=cfg.knobColor;
  hornBtn.style.background=cfg.hornColor;
  hornBtn.style.boxShadow='0 4px 16px '+cfg.hornGlow;
  hornLabel.textContent=mode==='firetruck'?'HONK':'SIREN';
  missionEl.parentElement.style.display='block';
  missionEl.style.background=cfg.missionColor;
}

// ── Audio ──────────────────────────────────────────────────────────────────────
var ac=null;
function getAC(){ if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} return ac; }
function beep(freq,dur,vol,type){
  vol=vol||0.15; type=type||'sine';
  try{
    var c=getAC(); if(!c) return;
    if(c.state==='suspended') c.resume();
    var o=c.createOscillator(),g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.linearRampToValueAtTime(0,c.currentTime+dur);
    o.start(c.currentTime); o.stop(c.currentTime+dur);
  }catch(e){}
}
function playPickup(){
  var f=[523,659,784,1047];
  for(var i=0;i<f.length;i++)(function(fr,d){setTimeout(function(){beep(fr,0.15,0.2);},d);})(f[i],i*100);
}
function playDeliver(){
  var f=[523,659,784,1047,1319];
  for(var i=0;i<f.length;i++)(function(fr,d){setTimeout(function(){beep(fr,0.18,0.22);},d);})(f[i],i*110);
}
function playHit(){ beep(200,0.35,0.3,'sawtooth'); }
function honkHorn(){
  var c=getAC(); if(!c) return;
  var doHonk=function(){
    if(mode==='firetruck'){
      beep(140,0.5,0.28,'sawtooth');
      setTimeout(function(){beep(160,0.4,0.22,'sawtooth');},100);
    } else {
      var f=[880,1100,880,1100];
      for(var i=0;i<f.length;i++)(function(fr,d){setTimeout(function(){beep(fr,0.13,0.15,'sawtooth');},d);})(f[i],i*150);
    }
  };
  if(c.state==='suspended'){c.resume().then(doHonk);}else{doHonk();}
}

// ── Rounded rect (iOS safe) ────────────────────────────────────────────────────
function rr(x,y,w,h,r){
  if(w<2*r)r=w/2; if(h<2*r)r=h/2;
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function fillRR(x,y,w,h,r,col){ ctx.fillStyle=col; ctx.beginPath(); rr(x,y,w,h,r); ctx.fill(); }
function strokeRR(x,y,w,h,r,col,lw){ ctx.strokeStyle=col; ctx.lineWidth=lw||2; ctx.beginPath(); rr(x,y,w,h,r); ctx.stroke(); }

// ── World helpers ──────────────────────────────────────────────────────────────
function scx(wx){ return wx; }
function scy(wy){ return wy-camY; }

// ── Spawn ──────────────────────────────────────────────────────────────────────
var EMOJIS=['🌳','🪨','🐄','🐔','🛢️','🚧','🪵','🦆'];

function spawnObstacles(){
  obstacles=[];
  if(mode==='firetruck') return; // clear road for fire truck
  var rL=CW()/2-ROAD_W/2;
  for(var wy=900;wy<WORLD_H-900;wy+=145+Math.random()*145){
    var count=Math.random()<0.4?2:1, used=[];
    for(var k=0;k<count;k++){
      var lane,tries=0;
      do{lane=Math.floor(Math.random()*3);tries++;}while(used.indexOf(lane)!==-1&&tries<10);
      used.push(lane);
      obstacles.push({
        x:rL+18+lane*(ROAD_W/3)+Math.random()*14-7,
        y:wy,
        emoji:EMOJIS[Math.floor(Math.random()*EMOJIS.length)],
        r:16, wobble:Math.random()*Math.PI*2
      });
    }
  }
}
function spawnScenery(){
  trees=[];
  for(var wy=0;wy<WORLD_H;wy+=100+Math.random()*70){
    trees.push({x:8+Math.random()*50,      y:wy,s:0.7+Math.random()*0.4,bush:Math.random()>0.6});
    trees.push({x:CW()-8-Math.random()*50, y:wy,s:0.7+Math.random()*0.4,bush:Math.random()>0.6});
  }
  clouds=[];
  for(var i=0;i<28;i++)
    clouds.push({x:Math.random()*CW(),y:Math.random()*WORLD_H,s:0.5+Math.random(),vx:0.15+Math.random()*0.2});
}

// ── Drawing ────────────────────────────────────────────────────────────────────
function drawRoad(){
  var rL=CW()/2-ROAD_W/2, rR=CW()/2+ROAD_W/2;
  ctx.fillStyle='#5aA030'; ctx.fillRect(0,0,CW(),CH());
  ctx.fillStyle='rgba(0,0,0,0.03)';
  for(var i=0;i<CW();i+=20) ctx.fillRect(i,0,10,CH());
  ctx.fillStyle='#606060'; ctx.fillRect(rL,0,ROAD_W,CH());
  ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(rL,0); ctx.lineTo(rL,CH()); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rR,0); ctx.lineTo(rR,CH()); ctx.stroke();
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=3;
  ctx.setLineDash([26,26]); ctx.lineDashOffset=-(camY%52);
  ctx.beginPath(); ctx.moveTo(CW()/2,0); ctx.lineTo(CW()/2,CH()); ctx.stroke();
  ctx.setLineDash([]);
}
function drawTree(t){
  var x=scx(t.x), y=scy(t.y);
  if(y<-60||y>CH()+60) return;
  ctx.save(); ctx.translate(x,y); ctx.scale(t.s,t.s);
  if(t.bush){
    ctx.fillStyle='#2d7a2d'; ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3d9e3d'; ctx.beginPath(); ctx.arc(-8,-5,9,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8,-5,9,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle='#5d3a1a'; ctx.fillRect(-4,-2,8,16);
    ctx.fillStyle='#1a5c1a'; ctx.beginPath(); ctx.arc(0,-14,17,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2e8b2e'; ctx.beginPath(); ctx.arc(-5,-20,11,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-18,9,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawCloud(c){
  var x=scx(c.x), y=scy(c.y);
  if(y<-70||y>CH()+70) return;
  ctx.save(); ctx.translate(x,y); ctx.scale(c.s,c.s);
  ctx.fillStyle='rgba(255,255,255,0.68)';
  ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.arc(24,-5,15,0,Math.PI*2);
  ctx.arc(-20,-3,13,0,Math.PI*2); ctx.arc(11,8,11,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// Destination 1: house (ambulance) OR big tree with kitten (firetruck)
function drawDest1(wy){
  if(mode==='ambulance'){
    drawHouse(wy);
  } else {
    drawKittenTree(wy);
  }
}
// Destination 2: hospital (ambulance) OR vet (firetruck)
function drawDest2(wy){
  if(mode==='ambulance'){
    drawHospital(wy);
  } else {
    drawVet(wy);
  }
}

function drawHouse(wy){
  var x=CW()/2-ROAD_W/2-52, y=scy(wy);
  if(y<-130||y>CH()+80) return;
  ctx.save(); ctx.translate(x,y);
  fillRR(-32,-48,64,48,3,'#fff9c4');
  strokeRR(-32,-48,64,48,3,'#f9a825',2.5);
  ctx.fillStyle='#f57f17';
  ctx.beginPath(); ctx.moveTo(-38,-48); ctx.lineTo(0,-80); ctx.lineTo(38,-48); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#6d4c41';
  ctx.beginPath(); ctx.arc(-0.5,-26,9,Math.PI,0); ctx.lineTo(9,0); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffd54f'; ctx.beginPath(); ctx.arc(6,-20,2.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#b3e5fc'; ctx.fillRect(-26,-40,13,11); ctx.fillRect(13,-40,13,11);
  ctx.strokeStyle='#0288d1'; ctx.lineWidth=1.5;
  ctx.strokeRect(-26,-40,13,11); ctx.strokeRect(13,-40,13,11);
  var bob=Math.sin(Date.now()/400)*4;
  ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('\uD83E\uDD12',0,-64+bob);
  ctx.font='bold 11px Comic Sans MS,cursive'; ctx.fillStyle='#c62828';
  ctx.textBaseline='alphabetic'; ctx.fillText('PICK UP!',0,14);
  ctx.restore();
}

function drawKittenTree(wy){
  var x=CW()/2-ROAD_W/2-58, y=scy(wy);
  if(y<-160||y>CH()+100) return;
  ctx.save(); ctx.translate(x,y);
  // Big trunk
  ctx.fillStyle='#5d3a1a'; ctx.fillRect(-10,0,20,50);
  ctx.fillStyle='#4e2e12'; ctx.fillRect(-10,-10,8,60);
  // Big canopy layers
  ctx.fillStyle='#1b5e20'; ctx.beginPath(); ctx.arc(0,-30,38,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2e7d32'; ctx.beginPath(); ctx.arc(-12,-44,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#388e3c'; ctx.beginPath(); ctx.arc(14,-50,24,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#43a047'; ctx.beginPath(); ctx.arc(0,-60,20,0,Math.PI*2); ctx.fill();
  // Kitten in tree, bouncing + meowing
  var bob=Math.sin(Date.now()/350)*4;
  ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('\uD83D\uDC31',0,-72+bob); // 🐱
  // Distress marks
  ctx.font='13px serif';
  ctx.fillText('!',16,-82+bob);
  ctx.fillText('!', -16,-78+bob);
  ctx.font='bold 11px Comic Sans MS,cursive'; ctx.fillStyle='#e65100';
  ctx.textBaseline='alphabetic'; ctx.fillText('RESCUE!',0,64);
  ctx.restore();
}

function drawHospital(wy){
  var x=CW()/2+ROAD_W/2+52, y=scy(wy);
  if(y<-150||y>CH()+100) return;
  ctx.save(); ctx.translate(x,y);
  fillRR(-42,-92,84,18,4,'#ef5350');
  fillRR(-42,-74,84,74,3,'#fff');
  strokeRR(-42,-74,84,74,3,'#ddd',2.5);
  ctx.fillStyle='#e53935'; ctx.fillRect(-5,-64,10,42); ctx.fillRect(-19,-52,38,14);
  ctx.fillStyle='#b3e5fc';
  ctx.fillRect(-30,-64,14,11); ctx.fillRect(-5,-64,14,11); ctx.fillRect(16,-64,14,11);
  ctx.font='bold 12px Comic Sans MS,cursive'; ctx.fillStyle='#b71c1c'; ctx.textAlign='center';
  ctx.textBaseline='alphabetic'; ctx.fillText('HOSPITAL',0,12);
  ctx.font='18px serif'; ctx.textBaseline='middle'; ctx.fillText('\uD83D\uDE91',0,-82);
  ctx.restore();
}

function drawVet(wy){
  var x=CW()/2+ROAD_W/2+52, y=scy(wy);
  if(y<-150||y>CH()+100) return;
  ctx.save(); ctx.translate(x,y);
  // Roof — green for vet
  fillRR(-42,-92,84,18,4,'#2e7d32');
  fillRR(-42,-74,84,74,3,'#f1f8e9');
  strokeRR(-42,-74,84,74,3,'#c8e6c9',2.5);
  // Paw print instead of cross
  ctx.font='28px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('\uD83D\uDC3E',-1,-40); // 🐾
  // Windows
  ctx.fillStyle='#b3e5fc';
  ctx.fillRect(-30,-64,14,11); ctx.fillRect(-5,-64,14,11); ctx.fillRect(16,-64,14,11);
  ctx.strokeStyle='#4caf50'; ctx.lineWidth=1.5;
  ctx.strokeRect(-30,-64,14,11); ctx.strokeRect(-5,-64,14,11); ctx.strokeRect(16,-64,14,11);
  // Sign
  ctx.font='bold 11px Comic Sans MS,cursive'; ctx.fillStyle='#1b5e20'; ctx.textAlign='center';
  ctx.textBaseline='alphabetic'; ctx.fillText('VET CLINIC',0,12);
  // Cat on roof
  ctx.font='16px serif'; ctx.textBaseline='middle'; ctx.fillText('\uD83D\uDC31',0,-84);
  ctx.restore();
}

function drawObstacle(ob){
  var x=scx(ob.x), y=scy(ob.y);
  if(y<-40||y>CH()+40) return;
  var wobble=Math.sin(Date.now()/500+ob.wobble)*2;
  ctx.save(); ctx.translate(x,y+wobble);
  ctx.font='24px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(ob.emoji,0,0);
  ctx.restore();
}

function drawVehicle(){
  var x=scx(veh.x), y=scy(veh.y);
  if(veh.invincible>0 && Math.floor(veh.invincible/4)%2===0) return;
  ctx.save(); ctx.translate(x,y); ctx.rotate(veh.angle);
  if(mode==='ambulance'){
    drawAmbulanceShape();
  } else {
    drawFiretruckShape();
  }
  ctx.restore();
}

function drawAmbulanceShape(){
  var w=AMB_W, h=AMB_H;
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(2,6,w/2+2,h/5,0,0,Math.PI*2); ctx.fill();
  fillRR(-w/2,-h/2,w,h,5,'#fff');
  strokeRR(-w/2,-h/2,w,h,5,'#ccc',1.5);
  ctx.fillStyle='#ef5350'; ctx.fillRect(-w/2+1,-h/2+7,w-2,9);
  ctx.fillStyle='#ef5350'; ctx.fillRect(-4,-h/2+20,8,14); ctx.fillRect(-8,-h/2+24,16,6);
  fillRR(-w/2+4,-h/2+2,w-8,13,3,'#b3e5fc');
  strokeRR(-w/2+4,-h/2+2,w-8,13,3,'#90caf9',1);
  var sc=(Math.floor(Date.now()/220)%2===0)?'#ef5350':'#42a5f5';
  fillRR(-7,-h/2-7,14,8,3,sc);
  ctx.shadowColor=sc; ctx.shadowBlur=12;
  ctx.beginPath(); rr(-7,-h/2-7,14,8,3); ctx.fillStyle=sc; ctx.fill();
  ctx.shadowBlur=0;
  var wpos=[[-w/2-2,-h/2+8],[w/2-6,-h/2+8],[-w/2-2,h/2-20],[w/2-6,h/2-20]];
  for(var i=0;i<wpos.length;i++){
    fillRR(wpos[i][0],wpos[i][1],8,12,2,'#333');
    ctx.fillStyle='#888'; ctx.beginPath(); ctx.arc(wpos[i][0]+4,wpos[i][1]+6,2,0,Math.PI*2); ctx.fill();
  }
  if(veh.hasCargo){
    ctx.font='11px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('\uD83D\uDE0A',0,h/4);
  }
}

function drawFiretruckShape(){
  var w=40, h=62;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(2,8,w/2+3,h/5,0,0,Math.PI*2); ctx.fill();
  // Main body — red
  fillRR(-w/2,-h/2,w,h,5,'#d32f2f');
  strokeRR(-w/2,-h/2,w,h,5,'#b71c1c',2);
  // Yellow stripe
  ctx.fillStyle='#FFD600'; ctx.fillRect(-w/2+1,-h/2+10,w-2,7);
  // Cab windshield
  fillRR(-w/2+3,-h/2+2,w-6,14,3,'#b3e5fc');
  strokeRR(-w/2+3,-h/2+2,w-6,14,3,'#90caf9',1);
  // Ladder on side
  ctx.strokeStyle='#FFD600'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-w/2+3,-h/2+20); ctx.lineTo(-w/2+3,h/2-12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-w/2+9,-h/2+20); ctx.lineTo(-w/2+9,h/2-12); ctx.stroke();
  for(var rung=-h/2+26; rung<h/2-14; rung+=8){
    ctx.beginPath(); ctx.moveTo(-w/2+3,rung); ctx.lineTo(-w/2+9,rung); ctx.stroke();
  }
  // Hose reel
  ctx.fillStyle='#e64a19';
  ctx.beginPath(); ctx.arc(w/2-8,-h/2+28,7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff7043';
  ctx.beginPath(); ctx.arc(w/2-8,-h/2+28,4,0,Math.PI*2); ctx.fill();
  // Siren bar on roof — alternates red/blue
  var s1=(Math.floor(Date.now()/200)%2===0)?'#ef5350':'#42a5f5';
  var s2=(Math.floor(Date.now()/200)%2===0)?'#42a5f5':'#ef5350';
  fillRR(-w/2+2,-h/2-8,w/2-2,8,3,s1);
  fillRR(0,-h/2-8,w/2-2,8,3,s2);
  ctx.shadowColor=s1; ctx.shadowBlur=10;
  ctx.beginPath(); rr(-w/2+2,-h/2-8,w/2-2,8,3); ctx.fillStyle=s1; ctx.fill();
  ctx.shadowBlur=0;
  // Wheels — bigger for truck
  var wpos=[[-w/2-3,-h/2+10],[w/2-7,-h/2+10],[-w/2-3,h/2-24],[w/2-7,h/2-24]];
  for(var i=0;i<wpos.length;i++){
    fillRR(wpos[i][0],wpos[i][1],10,16,2,'#222');
    ctx.fillStyle='#777'; ctx.beginPath(); ctx.arc(wpos[i][0]+5,wpos[i][1]+8,3,0,Math.PI*2); ctx.fill();
  }
  // Rescued kitten in cab
  if(veh.hasCargo){
    ctx.font='13px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('\uD83D\uDC31',0,h/4-4);
  }
}

function drawArrow(){
  var tY=phase==='to-dest1'?DEST1_Y:DEST2_Y;
  var sY=scy(tY);
  if(sY>60&&sY<CH()-60) return;
  var ay=sY<60?70:CH()-70, ax=CW()/2;
  var dir=sY<60?-Math.PI/2:Math.PI/2;
  var pulse=0.85+Math.sin(Date.now()/280)*0.15;
  var cfg=MODES[mode];
  var color=phase==='to-dest1'?cfg.arrowColor1:cfg.arrowColor2;
  ctx.save(); ctx.translate(ax,ay); ctx.rotate(dir); ctx.scale(pulse,pulse);
  ctx.fillStyle=color; ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(0,-20); ctx.lineTo(13,0); ctx.lineTo(6,0);
  ctx.lineTo(6,16); ctx.lineTo(-6,16); ctx.lineTo(-6,0); ctx.lineTo(-13,0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.rotate(-dir);
  ctx.font='bold 11px Comic Sans MS,cursive'; ctx.fillStyle='#fff';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=4;
  ctx.fillText(Math.round(Math.abs(tY-veh.y)/30)+'m',0,36);
  ctx.shadowBlur=0; ctx.restore();
}

function drawFlash(){
  if(flash<=0) return;
  ctx.fillStyle='rgba(255,40,40,'+(flash/20*0.4)+')';
  ctx.fillRect(0,0,CW(),CH());
}

// ── Physics ────────────────────────────────────────────────────────────────────
var VW=AMB_W; // collision width (same for both)
function update(){
  if(!running) return;
  if(veh.invincible>0) veh.invincible--;
  if(flash>0) flash--;
  var jx=joy.dx, jy=joy.dy;
  var mag=Math.sqrt(jx*jx+jy*jy);
  var topSpeed=mode==='firetruck'?4.2:4.6;
  if(mag>0.08){
    var ta=Math.atan2(jx,-jy), da=ta-veh.angle;
    while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
    veh.angle+=da*0.28;
    veh.speed=Math.min(veh.speed+0.19*mag, topSpeed);
  } else { veh.speed*=0.87; }
  veh.x+=Math.sin(veh.angle)*veh.speed;
  veh.y-=Math.cos(veh.angle)*veh.speed;
  var rL=CW()/2-ROAD_W/2+VW/2+2, rR=CW()/2+ROAD_W/2-VW/2-2;
  if(veh.x<rL){veh.x=rL; veh.speed*=0.5;}
  if(veh.x>rR){veh.x=rR; veh.speed*=0.5;}
  veh.y=Math.max(100,Math.min(WORLD_H-100,veh.y));
  camY=veh.y-CH()*0.6;
  if(camY<0)camY=0; if(camY>WORLD_H-CH())camY=WORLD_H-CH();
  // destination checks
  if(phase==='to-dest1'&&Math.abs(veh.y-DEST1_Y)<60){
    phase='to-dest2'; veh.hasCargo=true;
    playPickup();
    missionEl.textContent=MODES[mode].msg2;
  } else if(phase==='to-dest2'&&Math.abs(veh.y-DEST2_Y)<60){
    score++; scorePill.textContent='⭐ '+score;
    running=false; playDeliver();
    setTimeout(showCeleb,300);
  }
  // obstacles — bounce only
  if(veh.invincible===0){
    for(var i=0;i<obstacles.length;i++){
      var ob=obstacles[i];
      var dx=veh.x-ob.x, dy=veh.y-ob.y;
      if(Math.sqrt(dx*dx+dy*dy)<ob.r+VW/2-5){
        veh.invincible=50; flash=14; veh.speed=-2.5;
        playHit(); break;
      }
    }
  }
  for(var i=0;i<clouds.length;i++){
    clouds[i].x+=clouds[i].vx;
    if(clouds[i].x>CW()+80)clouds[i].x=-80;
  }
}

// ── Render ─────────────────────────────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,CW(),CH());
  drawRoad();
  for(var i=0;i<trees.length;i++) drawTree(trees[i]);
  for(var i=0;i<clouds.length;i++) drawCloud(clouds[i]);
  drawDest1(DEST1_Y);
  drawDest2(DEST2_Y);
  for(var i=0;i<obstacles.length;i++) drawObstacle(obstacles[i]);
  drawVehicle();
  drawArrow();
  drawFlash();
}

function loop(){ if(!running) return; update(); render(); requestAnimationFrame(loop); }

// ── Overlays ───────────────────────────────────────────────────────────────────
function showCeleb(){
  var cfg=MODES[mode];
  var m=cfg.celebMsgs[Math.floor(Math.random()*cfg.celebMsgs.length)];
  document.getElementById('ov-emoji').textContent=m.e;
  document.getElementById('ov-title').textContent=m.t;
  document.getElementById('ov-title').style.color=mode==='firetruck'?'#e65100':'#c62828';
  document.getElementById('ov-sub').textContent=m.s;
  document.getElementById('ov-btn').textContent=cfg.nextBtn;
  document.getElementById('ov-btn').style.background=mode==='firetruck'?'#ff6f00':'#e53935';
  ovAction=nextRound;
  overlay.style.display='flex';
  launchConfetti();
}

function launchConfetti(){
  var cols=['#EF5350','#42A5F5','#FFD700','#66BB6A','#AB47BC','#FF7043'];
  for(var i=0;i<50;i++){
    var c=document.createElement('div'); c.className='confetti';
    var sz=8+Math.random()*8;
    c.style.cssText='left:'+Math.random()*100+'%;top:-10px;background:'+cols[Math.floor(Math.random()*cols.length)]+
      ';width:'+sz+'px;height:'+sz+'px;border-radius:'+(Math.random()>.5?'50%':'2px')+
      ';animation-duration:'+(1.8+Math.random()*2)+'s;animation-delay:'+Math.random()*0.6+'s';
    wrap.appendChild(c);
    setTimeout(function(el){if(el.parentNode)el.parentNode.removeChild(el);},4500,c);
  }
}

// ── Add "Change Vehicle" button to overlay ─────────────────────────────────────
var changeBtn = document.createElement('div');
changeBtn.style.cssText='margin-top:10px;font-size:13px;color:#888;cursor:pointer;text-decoration:underline;';
changeBtn.textContent='Change vehicle';
document.getElementById('overlay-card').appendChild(changeBtn);
changeBtn.addEventListener('touchstart',function(e){e.preventDefault();overlay.style.display='none';showPicker();},{passive:false});
changeBtn.addEventListener('click',function(){overlay.style.display='none';showPicker();});

function showPicker(){
  running=false;
  picker.style.display='flex';
}

// ── Start / Reset ──────────────────────────────────────────────────────────────
function startGame(){
  resize();
  veh.x=CW()/2; veh.y=200; veh.angle=0; veh.speed=0;
  veh.hasCargo=false; veh.invincible=0;
  phase='to-dest1'; score=0; flash=0; camY=0;
  scorePill.textContent='⭐ 0';
  spawnObstacles(); spawnScenery();
  missionEl.textContent=MODES[mode].msg1;
  running=true;
  requestAnimationFrame(loop);
}

function nextRound(){
  resize();
  veh.x=CW()/2; veh.y=200; veh.angle=0; veh.speed=0;
  veh.hasCargo=false; veh.invincible=0;
  phase='to-dest1'; flash=0; camY=0;
  spawnObstacles();
  missionEl.textContent=MODES[mode].msg1;
  running=true;
  requestAnimationFrame(loop);
}

})();
</script>
</body>
