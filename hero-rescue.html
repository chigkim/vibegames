<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hero Rescue! v4</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background:#1a1a2e;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  height:100dvh;
  width:100vw;
  width:100dvw;
  overflow:hidden;
  font-family:'Comic Sans MS','Chalkboard SE',cursive;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
#wrap {
  position:relative;
  width:min(100vw, 1280px);
  width:min(100dvw, 1280px);
  height:min(100vh, 1280px);
  height:min(100dvh, 1280px);
  overflow:hidden;
  border-radius:clamp(0px, 1.3vmin, 12px);
  background:#000;
}
#game-root, canvas { width:100%; height:100%; display:block; touch-action:none; }
#hud {
  position:absolute;
  top:0;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:clamp(10px, 1.8vmin, 18px) clamp(12px, 2vmin, 22px);
  pointer-events:none;
  z-index:10;
}
.hud-pill {
  background:rgba(0,0,0,0.6);
  border-radius:20px;
  padding:clamp(6px, 1vmin, 11px) clamp(14px, 2vmin, 22px);
  color:#fff;
  font-size:clamp(15px, 2.1vmin, 23px);
  font-weight:bold;
}
#mission-banner {
  position:absolute;
  top:clamp(52px, 8vmin, 86px);
  left:0;
  right:0;
  text-align:center;
  pointer-events:none;
  z-index:10;
}
#mission-text {
  display:inline-block;
  color:#fff;
  font-size:clamp(13px, 1.8vmin, 20px);
  font-weight:bold;
  padding:clamp(5px, 0.9vmin, 10px) clamp(16px, 2.4vmin, 28px);
  border-radius:20px;
}
#joystick-zone {
  position:absolute;
  bottom:max(18px, env(safe-area-inset-bottom));
  left:max(16px, env(safe-area-inset-left));
  width:clamp(128px, 22vmin, 190px);
  height:clamp(128px, 22vmin, 190px);
  z-index:20;
  touch-action:none;
}
#horn-btn {
  position:absolute;
  bottom:max(22px, env(safe-area-inset-bottom));
  right:max(18px, env(safe-area-inset-right));
  width:clamp(78px, 13vmin, 118px);
  height:clamp(78px, 13vmin, 118px);
  border-radius:50%;
  border:clamp(4px, 0.7vmin, 7px) solid rgba(255,255,255,0.4);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:clamp(26px, 4vmin, 42px);
  color:#fff;
  z-index:20;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  cursor:pointer;
  touch-action:none;
}
#horn-btn div { font-size:clamp(10px, 1.5vmin, 15px); font-weight:bold; margin-top:1px; }
#horn-btn div:first-child { font-size:clamp(26px, 4vmin, 42px); line-height:1; }
#overlay {
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}
#overlay-card {
  background:#fff;
  border-radius:24px;
  padding:clamp(24px, 4vmin, 42px) clamp(28px, 4.5vmin, 48px);
  text-align:center;
  max-width:min(88vw, 440px);
}
#ov-emoji { font-size:clamp(52px, 8vmin, 82px); line-height:1.1; }
#ov-title { font-size:clamp(21px, 3vmin, 32px); font-weight:bold; margin:8px 0 4px; }
#ov-sub { font-size:clamp(13px, 1.8vmin, 19px); color:#555; margin-bottom:16px; line-height:1.5; }
#ov-btn {
  color:#fff;
  border:none;
  border-radius:50px;
  padding:clamp(12px, 2vmin, 18px) clamp(36px, 5vmin, 54px);
  font-size:clamp(17px, 2.4vmin, 25px);
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
  display:inline-block;
}
#picker {
  position:absolute;
  inset:0;
  background:linear-gradient(160deg,#1a237e 0%,#311b92 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:60;
  gap:14px;
  padding:clamp(20px, 4vmin, 44px);
}
#picker h1 {
  color:#fff;
  font-size:clamp(24px, 4vmin, 42px);
  text-shadow:0 2px 8px rgba(0,0,0,0.4);
  margin-bottom:4px;
}
.version {
  color:rgba(255,255,255,0.35);
  font-size:clamp(11px, 1.5vmin, 15px);
  margin-top:-8px;
  letter-spacing:1px;
}
.pick-btn {
  width:min(78vw, 370px);
  padding:clamp(16px, 2.6vmin, 26px) clamp(20px, 3vmin, 32px);
  border-radius:20px;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:clamp(16px, 2.4vmin, 28px);
  box-shadow:0 6px 20px rgba(0,0,0,0.35);
  font-family:inherit;
}
.pick-btn:active { transform:scale(0.96); }
.pick-icon { font-size:clamp(40px, 6vmin, 62px); line-height:1; }
.pick-text { text-align:left; }
.pick-text strong { display:block; font-size:clamp(17px, 2.4vmin, 24px); }
.pick-text span { font-size:clamp(12px, 1.7vmin, 17px); opacity:0.85; }
.pick-amb { background:linear-gradient(135deg,#ffffff 0%,#ffcdd2 100%); color:#b71c1c; }
.pick-fire { background:linear-gradient(135deg,#ff8a65 0%,#d32f2f 100%); color:#fff; }
.pick-police { background:linear-gradient(135deg,#42a5f5 0%,#0d47a1 100%); color:#fff; }
.change-link {
  margin-top:10px;
  font-size:13px;
  color:#888;
  cursor:pointer;
  text-decoration:underline;
}
.confetti {
  position:absolute;
  pointer-events:none;
  animation:cfall linear forwards;
  z-index:70;
}
@keyframes cfall {
  0% { opacity:1; transform:translateY(0) rotate(0deg); }
  100% { opacity:0; transform:translateY(110vh) rotate(720deg); }
}
</style>
</head>
<body>
<div id="wrap">
  <div id="game-root"></div>
  <div id="hud"><div class="hud-pill" id="score-pill">⭐ 0</div></div>
  <div id="mission-banner"><div id="mission-text"></div></div>
  <div id="joystick-zone"></div>
  <div id="horn-btn"><div>🔊</div><div id="horn-label">SIREN</div></div>

  <div id="overlay">
    <div id="overlay-card">
      <div id="ov-emoji">🎉</div>
      <div id="ov-title">Great job!</div>
      <div id="ov-sub"></div>
      <button id="ov-btn">Again!</button>
      <div class="change-link" id="change-vehicle">Change vehicle</div>
    </div>
  </div>

  <div id="picker">
    <h1>🚨 Hero Rescue! 🚨</h1>
    <div class="version">v4 - Updated 2026-05-08 19:24 EDT - Phaser + Tone + nippleJS</div>
    <button class="pick-btn pick-amb" id="btn-amb">
      <div class="pick-icon">🚑</div>
      <div class="pick-text">
        <strong>Ambulance</strong>
        <span>Pick up a sick person<br>&amp; race to the hospital!</span>
      </div>
    </button>
    <button class="pick-btn pick-fire" id="btn-fire">
      <div class="pick-icon">🚒</div>
      <div class="pick-text">
        <strong>Fire Truck</strong>
        <span>Save the kitten in a tree<br>&amp; take it to the vet!</span>
      </div>
    </button>
    <button class="pick-btn pick-police" id="btn-police">
      <div class="pick-icon">🚓</div>
      <div class="pick-text">
        <strong>Police Car</strong>
        <span>Chase the bad guy<br>&amp; take them to jail!</span>
      </div>
    </button>
  </div>
</div>

<script src="./libs/phaser-3.90.0.min.js"></script>
<script src="./libs/tone-15.1.22.js"></script>
<script src="./libs/zzfx-1.3.2.micro.min.js"></script>
<script src="./libs/nipplejs-0.10.2.min.js"></script>
<script>
(function() {
"use strict";

const wrap = document.getElementById('wrap');
const overlay = document.getElementById('overlay');
const ovBtn = document.getElementById('ov-btn');
const hornBtn = document.getElementById('horn-btn');
const hornLabel = document.getElementById('horn-label');
const missionEl = document.getElementById('mission-text');
const scorePill = document.getElementById('score-pill');
const picker = document.getElementById('picker');
const joyZone = document.getElementById('joystick-zone');

const ROAD_W = 160;
const WORLD_H = 3200;
const DEST1_Y = 520;
const DEST2_Y = WORLD_H - 520;
const VEH_W = 36;
const GAME_MAX_WIDTH = 1280;
const GAME_MAX_HEIGHT = 1280;

const MODES = {
  ambulance: {
    missionColor: 'rgba(210,40,40,0.9)',
    knobColor: '#e53935',
    hornColor: '#e53935',
    hornGlow: 'rgba(200,0,0,0.5)',
    hornLabel: 'SIREN',
    msg1: 'Drive to the sick house!',
    msg2: 'Race to the hospital!',
    arrow1: 0xffd700,
    arrow2: 0x42a5f5,
    titleColor: '#c62828',
    btnColor: '#e53935',
    nextBtn: 'Next Rescue!',
    topSpeed: 4.6,
    celebs: [
      ['🎉', 'You saved them!', 'You are an ambulance hero!'],
      ['⭐', 'Amazing job!', 'The patient says thank you!'],
      ['🏆', 'Super Driver!', 'Zoom zoom to the rescue!'],
      ['💗', 'You are the best!', 'Another life saved!']
    ]
  },
  firetruck: {
    missionColor: 'rgba(220,100,0,0.92)',
    knobColor: '#ff6f00',
    hornColor: '#ff6f00',
    hornGlow: 'rgba(255,100,0,0.5)',
    hornLabel: 'HONK',
    msg1: 'Drive to the kitten in the tree!',
    msg2: 'Race to the vet!',
    arrow1: 0xffd700,
    arrow2: 0x66bb6a,
    titleColor: '#e65100',
    btnColor: '#ff6f00',
    nextBtn: 'Next Rescue!',
    topSpeed: 4.2,
    celebs: [
      ['🐱', 'Kitty is safe!', 'You are a fire truck hero!'],
      ['⭐', 'Amazing rescue!', 'The kitten says purrr!'],
      ['🏆', 'Super Firefighter!', 'Kitty is so happy!'],
      ['💗', 'You are the best!', 'Kitty loves you!']
    ]
  },
  police: {
    missionColor: 'rgba(13,71,161,0.92)',
    knobColor: '#1565c0',
    hornColor: '#1565c0',
    hornGlow: 'rgba(21,101,192,0.5)',
    hornLabel: 'WOOP',
    msg1: 'Chase the bad guy!',
    msg2: 'Take them to jail!',
    arrow1: 0xffd700,
    arrow2: 0xef5350,
    titleColor: '#0d47a1',
    btnColor: '#1565c0',
    nextBtn: 'Next Chase!',
    topSpeed: 5.4,
    celebs: [
      ['🚓', 'Got them!', 'You are a police hero!'],
      ['⭐', 'Amazing chase!', 'The bad guy is in jail!'],
      ['🏆', 'Super Officer!', 'You caught them!'],
      ['💗', 'You are the best!', 'The town is safe!']
    ]
  }
};

let heroScene = null;
let mode = 'ambulance';
let joystick = null;
let joy = { dx: 0, dy: 0 };
let audioReady = false;
let audioBus = null;
let pickupSynth = null;
let deliverSynth = null;
let hornSynth = null;

function gameSize() {
  const viewport = window.visualViewport || window;
  return {
    width: Math.min(wrap.clientWidth || Math.round(viewport.width || window.innerWidth) || 375, GAME_MAX_WIDTH),
    height: Math.min(wrap.clientHeight || Math.round(viewport.height || window.innerHeight) || 667, GAME_MAX_HEIGHT)
  };
}

function hex(hexString) {
  return parseInt(hexString.slice(1), 16);
}

async function initAudio() {
  if (!window.Tone) return;
  if (!audioReady) {
    audioBus = new Tone.Volume(-8).toDestination();
    const delay = new Tone.FeedbackDelay({ delayTime: 0.08, feedback: 0.12, wet: 0.14 }).connect(audioBus);
    pickupSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'triangle' },
      envelope: { attack: 0.005, decay: 0.08, sustain: 0.08, release: 0.1 }
    }).connect(delay);
    deliverSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'sine' },
      envelope: { attack: 0.005, decay: 0.1, sustain: 0.1, release: 0.12 }
    }).connect(delay);
    hornSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'square' },
      envelope: { attack: 0.004, decay: 0.12, sustain: 0.08, release: 0.08 }
    }).connect(audioBus);
    audioReady = true;
  }
  try {
    await Tone.start();
    resumeZzfx();
  } catch {
    // The game should keep running if a browser delays audio unlock.
  }
}

function resumeZzfx() {
  try {
    if (typeof zzfxX !== 'undefined' && zzfxX.state === 'suspended') zzfxX.resume();
  } catch {
    // ZzFX is optional; Tone handles the longer musical cues.
  }
}

function playArcadeSound(params) {
  resumeZzfx();
  try {
    if (typeof zzfx === 'function') zzfx(...params);
  } catch {
    // Ignore audio failures so gameplay is never blocked.
  }
}

function playPickup() {
  if (!audioReady) return;
  const now = Tone.now();
  ['C5', 'E5', 'G5', 'C6'].forEach((note, i) => {
    pickupSynth.triggerAttackRelease(note, 0.12, now + i * 0.09, 0.48);
  });
}

function playDeliver() {
  if (!audioReady) return;
  const now = Tone.now();
  ['C5', 'E5', 'G5', 'C6', 'E6'].forEach((note, i) => {
    deliverSynth.triggerAttackRelease(note, 0.14, now + i * 0.1, 0.5);
  });
}

function playHit() {
  initAudio();
  playArcadeSound([0.7, 0.08, 95, 0.01, 0.05, 0.22, 3, 1.8, -0.16, 0, 0, 0, 0, 0.35]);
}

function honkHorn() {
  initAudio();
  if (!audioReady) return;
  const now = Tone.now();
  if (mode === 'firetruck') {
    hornSynth.triggerAttackRelease('C3', 0.32, now, 0.5);
    hornSynth.triggerAttackRelease('D3', 0.26, now + 0.12, 0.45);
  } else if (mode === 'police') {
    ['D5', 'G5', 'D5', 'G5'].forEach((note, i) => hornSynth.triggerAttackRelease(note, 0.1, now + i * 0.12, 0.35));
  } else {
    ['A5', 'C6', 'A5', 'C6'].forEach((note, i) => hornSynth.triggerAttackRelease(note, 0.12, now + i * 0.14, 0.35));
  }
}

function applyModeStyle() {
  const cfg = MODES[mode];
  hornBtn.style.background = cfg.hornColor;
  hornBtn.style.boxShadow = '0 4px 16px ' + cfg.hornGlow;
  hornLabel.textContent = cfg.hornLabel;
  missionEl.style.background = cfg.missionColor;
  joyZone.style.setProperty('--hero-joy-color', cfg.knobColor);
}

function resetJoystick() {
  joy.dx = 0;
  joy.dy = 0;
}

function setupJoystick() {
  if (!window.nipplejs || joystick) return;
  const zoneSize = Math.min(joyZone.clientWidth || 140, joyZone.clientHeight || 140);
  const center = Math.round(zoneSize / 2) + 'px';
  const size = Math.round(zoneSize * 0.9);
  joystick = nipplejs.create({
    zone: joyZone,
    mode: 'static',
    position: { left: center, top: center },
    size,
    color: MODES[mode].knobColor,
    restOpacity: 0.72,
    lockX: false,
    lockY: false,
    multitouch: false,
    mouseSupport: true
  });
  joystick.on('move', function(evt, data) {
    const angle = data.angle ? data.angle.radian : 0;
    const force = Math.min(data.force || 0, 1);
    joy.dx = Math.cos(angle) * force;
    joy.dy = -Math.sin(angle) * force;
  });
  joystick.on('end', resetJoystick);
}

function refreshJoystickColor() {
  if (!joystick) return;
  joystick.destroy();
  joystick = null;
  setupJoystick();
}

class HeroScene extends Phaser.Scene {
  constructor() {
    super('HeroScene');
    this.running = false;
    this.phase = 'to-dest1';
    this.score = 0;
    this.flash = 0;
    this.camY = 0;
    this.obstacles = [];
    this.trees = [];
    this.clouds = [];
    this.labels = [];
    this.veh = { x: 0, y: 200, angle: 0, speed: 0, hasCargo: false, invincible: 0 };
    this.badGuy = { x: 0, y: 0, angle: 0, speed: 0, caught: false, fleeing: false };
  }

  create() {
    heroScene = this;
    window.heroScene = this;
    this.g = this.add.graphics();
    this.resizeGame();
    this.spawnScenery();
    this.onWindowResize = () => this.resizeGame();
    window.addEventListener('resize', this.onWindowResize);
  }

  resizeGame() {
    const size = gameSize();
    this.w = size.width;
    this.h = size.height;
    this.S = Math.max(1, Math.min(this.w / 480, this.h / 760, 1.55));
    this.roadW = Math.min(ROAD_W * this.S, this.w * 0.58);
    this.vehicleW = VEH_W * this.S;
    this.scale.resize(size.width, size.height);
    if (this.veh) {
      const rL = this.w / 2 - this.roadW / 2 + this.vehicleW / 2 + 2 * this.S;
      const rR = this.w / 2 + this.roadW / 2 - this.vehicleW / 2 - 2 * this.S;
      this.veh.x = Phaser.Math.Clamp(this.veh.x, rL, rR);
    }
  }

  startGame(resetScore) {
    this.resizeGame();
    this.veh = { x: this.w / 2, y: 200, angle: 0, speed: 0, hasCargo: false, invincible: 0 };
    this.badGuy = { x: this.w / 2, y: DEST1_Y, angle: 0, speed: 0, caught: false, fleeing: false };
    this.phase = 'to-dest1';
    this.flash = 0;
    this.camY = 0;
    if (resetScore) this.score = 0;
    scorePill.textContent = '⭐ ' + this.score;
    this.spawnObstacles();
    this.spawnScenery();
    missionEl.textContent = MODES[mode].msg1;
    this.running = true;
    overlay.style.display = 'none';
    this.renderScene();
  }

  spawnObstacles() {
    this.obstacles = [];
    if (mode !== 'ambulance') return;
    const S = this.S || 1;
    const roadW = this.roadW || ROAD_W;
    const rL = this.w / 2 - roadW / 2;
    for (let wy = 900; wy < WORLD_H - 900; wy += 145 + Math.random() * 145) {
      const count = Math.random() < 0.4 ? 2 : 1;
      const used = [];
      for (let k = 0; k < count; k++) {
        let lane = 0;
        let tries = 0;
        do {
          lane = Math.floor(Math.random() * 3);
          tries++;
        } while (used.includes(lane) && tries < 10);
        used.push(lane);
        this.obstacles.push({
          x: rL + 18 * S + lane * (roadW / 3) + (Math.random() * 14 - 7) * S,
          y: wy,
          r: 16 * S,
          wobble: Math.random() * Math.PI * 2
        });
      }
    }
  }

  spawnScenery() {
    this.trees = [];
    const S = this.S || 1;
    for (let wy = 0; wy < WORLD_H; wy += 100 + Math.random() * 70) {
      this.trees.push({ x: 8 * S + Math.random() * 50 * S, y: wy, s: (0.7 + Math.random() * 0.4) * S, bush: Math.random() > 0.6 });
      this.trees.push({ x: this.w - 8 * S - Math.random() * 50 * S, y: wy, s: (0.7 + Math.random() * 0.4) * S, bush: Math.random() > 0.6 });
    }
    this.clouds = [];
    for (let i = 0; i < 28; i++) {
      this.clouds.push({ x: Math.random() * this.w, y: Math.random() * WORLD_H, s: 0.5 + Math.random(), vx: 0.15 + Math.random() * 0.2 });
    }
  }

  update(time, delta) {
    const dt = Math.min(delta / 16.67, 3);
    if (this.running) this.updateGame(dt);
    this.renderScene();
  }

  updateGame(dt) {
    const cfg = MODES[mode];
    if (this.veh.invincible > 0) this.veh.invincible--;
    if (this.flash > 0) this.flash--;

    const jx = joy.dx;
    const jy = joy.dy;
    const mag = Math.sqrt(jx * jx + jy * jy);
    if (mag > 0.08) {
      const targetAngle = Math.atan2(jx, -jy);
      let deltaAngle = targetAngle - this.veh.angle;
      while (deltaAngle > Math.PI) deltaAngle -= Math.PI * 2;
      while (deltaAngle < -Math.PI) deltaAngle += Math.PI * 2;
      this.veh.angle += deltaAngle * 0.28;
      this.veh.speed = Math.min(this.veh.speed + 0.19 * mag * dt, cfg.topSpeed);
    } else {
      this.veh.speed *= Math.pow(0.87, dt);
    }

    this.veh.x += Math.sin(this.veh.angle) * this.veh.speed * dt;
    this.veh.y -= Math.cos(this.veh.angle) * this.veh.speed * dt;

    const S = this.S || 1;
    const roadW = this.roadW || ROAD_W;
    const vehW = this.vehicleW || VEH_W;
    const rL = this.w / 2 - roadW / 2 + vehW / 2 + 2 * S;
    const rR = this.w / 2 + roadW / 2 - vehW / 2 - 2 * S;
    if (this.veh.x < rL) { this.veh.x = rL; this.veh.speed *= 0.5; }
    if (this.veh.x > rR) { this.veh.x = rR; this.veh.speed *= 0.5; }
    this.veh.y = Phaser.Math.Clamp(this.veh.y, 100, WORLD_H - 100);
    this.camY = Phaser.Math.Clamp(this.veh.y - this.h * 0.6, 0, WORLD_H - this.h);

    if (mode === 'police' && !this.badGuy.caught) this.updateBadGuy(dt);
    this.checkMission();
    this.checkObstacles();

    for (const cloud of this.clouds) {
      cloud.x += cloud.vx * dt;
      if (cloud.x > this.w + 80) cloud.x = -80;
    }
  }

  updateBadGuy(dt) {
    const bdx = this.veh.x - this.badGuy.x;
    const bdy = this.veh.y - this.badGuy.y;
    const bdist = Math.sqrt(bdx * bdx + bdy * bdy);
    if (bdist < 240) this.badGuy.fleeing = true;
    if (this.badGuy.fleeing) {
      const fleeAngle = Math.atan2(-bdx, -bdy);
      let d = fleeAngle - this.badGuy.angle;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      this.badGuy.angle += d * 0.14;
      this.badGuy.speed = Math.min(this.badGuy.speed + 0.1 * dt, 2.8);
    } else {
      this.badGuy.speed *= Math.pow(0.92, dt);
    }

    this.badGuy.x += Math.sin(this.badGuy.angle) * this.badGuy.speed * dt;
    this.badGuy.y -= Math.cos(this.badGuy.angle) * this.badGuy.speed * dt;
    const S = this.S || 1;
    const roadW = this.roadW || ROAD_W;
    const bgL = this.w / 2 - roadW / 2 + 16 * S;
    const bgR = this.w / 2 + roadW / 2 - 16 * S;
    if (this.badGuy.x < bgL) { this.badGuy.x = bgL; this.badGuy.angle = Math.PI - this.badGuy.angle; }
    if (this.badGuy.x > bgR) { this.badGuy.x = bgR; this.badGuy.angle = Math.PI - this.badGuy.angle; }
    if (this.badGuy.y <= 250) { this.badGuy.y = 250; this.badGuy.angle = -this.badGuy.angle; }
    if (this.badGuy.y >= WORLD_H - 250) { this.badGuy.y = WORLD_H - 250; this.badGuy.angle = -this.badGuy.angle; }

    if (bdist < 36 * (this.S || 1)) {
      this.badGuy.caught = true;
      this.veh.hasCargo = true;
      this.phase = 'to-dest2';
      playPickup();
      missionEl.textContent = MODES[mode].msg2;
    }
  }

  checkMission() {
    if (mode !== 'police' && this.phase === 'to-dest1' && Math.abs(this.veh.y - DEST1_Y) < 60) {
      this.phase = 'to-dest2';
      this.veh.hasCargo = true;
      playPickup();
      missionEl.textContent = MODES[mode].msg2;
    }

    if (this.phase === 'to-dest2' && Math.abs(this.veh.y - DEST2_Y) < 60) {
      this.score++;
      scorePill.textContent = '⭐ ' + this.score;
      this.running = false;
      resetJoystick();
      playDeliver();
      window.setTimeout(() => this.showCelebration(), 300);
    }
  }

  checkObstacles() {
    if (this.veh.invincible > 0) return;
    for (const ob of this.obstacles) {
      const dist = Phaser.Math.Distance.Between(this.veh.x, this.veh.y, ob.x, ob.y);
      if (dist < ob.r + (this.vehicleW || VEH_W) / 2 - 5 * (this.S || 1)) {
        this.veh.invincible = 50;
        this.flash = 14;
        this.veh.speed = -2.5;
        playHit();
        break;
      }
    }
  }

  showCelebration() {
    const cfg = MODES[mode];
    const msg = Phaser.Utils.Array.GetRandom(cfg.celebs);
    document.getElementById('ov-emoji').textContent = msg[0];
    document.getElementById('ov-title').textContent = msg[1];
    document.getElementById('ov-title').style.color = cfg.titleColor;
    document.getElementById('ov-sub').textContent = msg[2];
    ovBtn.textContent = cfg.nextBtn + ' 🚓';
    ovBtn.style.background = cfg.btnColor;
    overlay.style.display = 'flex';
    this.launchConfetti();
  }

  launchConfetti() {
    const colors = ['#EF5350', '#42A5F5', '#FFD700', '#66BB6A', '#AB47BC', '#FF7043'];
    for (let i = 0; i < 50; i++) {
      const piece = document.createElement('div');
      const size = 8 + Math.random() * 8;
      piece.className = 'confetti';
      piece.style.cssText =
        'left:' + Math.random() * 100 + '%;top:-10px;background:' + Phaser.Utils.Array.GetRandom(colors) +
        ';width:' + size + 'px;height:' + size + 'px;border-radius:' + (Math.random() > 0.5 ? '50%' : '2px') +
        ';animation-duration:' + (1.8 + Math.random() * 2) + 's;animation-delay:' + Math.random() * 0.6 + 's';
      wrap.appendChild(piece);
      window.setTimeout(() => piece.parentNode && piece.parentNode.removeChild(piece), 4500);
    }
  }

  sx(x) { return x; }
  sy(y) { return y - this.camY; }

  renderScene() {
    for (const label of this.labels) label.destroy();
    this.labels = [];
    this.g.clear();
    this.drawRoad();
    for (const tree of this.trees) this.drawTree(tree);
    for (const cloud of this.clouds) this.drawCloud(cloud);
    if (mode === 'ambulance') {
      this.drawHouse(DEST1_Y);
      this.drawHospital(DEST2_Y);
    } else if (mode === 'firetruck') {
      this.drawKittenTree(DEST1_Y);
      this.drawVet(DEST2_Y);
    } else {
      this.drawBadGuy();
      this.drawJail(DEST2_Y);
    }
    for (const obstacle of this.obstacles) this.drawObstacle(obstacle);
    this.drawVehicle();
    this.drawArrow();
    this.drawFlash();
  }

  drawRoad() {
    const S = this.S || 1;
    const roadW = this.roadW || ROAD_W;
    const rL = this.w / 2 - roadW / 2;
    const rR = this.w / 2 + roadW / 2;
    this.g.fillStyle(0x5aa030, 1);
    this.g.fillRect(0, 0, this.w, this.h);
    this.g.fillStyle(0x000000, 0.03);
    for (let i = 0; i < this.w; i += 20 * S) this.g.fillRect(i, 0, 10 * S, this.h);
    this.g.fillStyle(0x606060, 1);
    this.g.fillRect(rL, 0, roadW, this.h);
    this.g.lineStyle(4 * S, 0xffffff, 1);
    this.g.lineBetween(rL, 0, rL, this.h);
    this.g.lineBetween(rR, 0, rR, this.h);
    this.g.lineStyle(3 * S, 0xffd700, 1);
    const dash = 52 * S;
    for (let y = -((this.camY % dash) + dash); y < this.h + dash; y += dash) {
      this.g.lineBetween(this.w / 2, y, this.w / 2, y + 26 * S);
    }
  }

  drawTree(tree) {
    const x = this.sx(tree.x);
    const y = this.sy(tree.y);
    if (y < -60 || y > this.h + 60) return;
    const s = tree.s;
    if (tree.bush) {
      this.g.fillStyle(0x2d7a2d, 1);
      this.g.fillCircle(x, y, 14 * s);
      this.g.fillStyle(0x3d9e3d, 1);
      this.g.fillCircle(x - 8 * s, y - 5 * s, 9 * s);
      this.g.fillCircle(x + 8 * s, y - 5 * s, 9 * s);
    } else {
      this.g.fillStyle(0x5d3a1a, 1);
      this.g.fillRect(x - 4 * s, y - 2 * s, 8 * s, 16 * s);
      this.g.fillStyle(0x1a5c1a, 1);
      this.g.fillCircle(x, y - 14 * s, 17 * s);
      this.g.fillStyle(0x2e8b2e, 1);
      this.g.fillCircle(x - 5 * s, y - 20 * s, 11 * s);
      this.g.fillCircle(x + 7 * s, y - 18 * s, 9 * s);
    }
  }

  drawCloud(cloud) {
    const x = this.sx(cloud.x);
    const y = this.sy(cloud.y);
    if (y < -70 || y > this.h + 70) return;
    const s = cloud.s;
    this.g.fillStyle(0xffffff, 0.68);
    this.g.fillCircle(x, y, 18 * s);
    this.g.fillCircle(x + 24 * s, y - 5 * s, 15 * s);
    this.g.fillCircle(x - 20 * s, y - 3 * s, 13 * s);
    this.g.fillCircle(x + 11 * s, y + 8 * s, 11 * s);
  }

  drawHouse(wy) {
    const S = this.S || 1;
    const x = this.w / 2 - (this.roadW || ROAD_W) / 2 - 52 * S;
    const y = this.sy(wy);
    if (y < -130 || y > this.h + 80) return;
    this.g.fillStyle(0xfff9c4, 1);
    this.g.fillRoundedRect(x - 32, y - 48, 64, 48, 3);
    this.g.lineStyle(2.5, 0xf9a825, 1);
    this.g.strokeRoundedRect(x - 32, y - 48, 64, 48, 3);
    this.g.fillStyle(0xf57f17, 1);
    this.g.fillTriangle(x - 38, y - 48, x, y - 80, x + 38, y - 48);
    this.g.fillStyle(0xb3e5fc, 1);
    this.g.fillRect(x - 26, y - 40, 13, 11);
    this.g.fillRect(x + 13, y - 40, 13, 11);
    if (this.phase === 'to-dest1' && !this.veh.hasCargo) {
      this.drawText('🤒', x, y - 64 + Math.sin(this.time.now / 400) * 4, 22);
      this.drawText('PICK UP!', x, y + 14, 11, '#c62828', 'bold');
    }
  }

  drawKittenTree(wy) {
    const S = this.S || 1;
    const x = this.w / 2 - (this.roadW || ROAD_W) / 2 - 58 * S;
    const y = this.sy(wy);
    if (y < -160 || y > this.h + 100) return;
    this.g.fillStyle(0x5d3a1a, 1);
    this.g.fillRect(x - 10, y, 20, 50);
    this.g.fillStyle(0x1b5e20, 1);
    this.g.fillCircle(x, y - 30, 38);
    this.g.fillStyle(0x2e7d32, 1);
    this.g.fillCircle(x - 12, y - 44, 28);
    this.g.fillStyle(0x388e3c, 1);
    this.g.fillCircle(x + 14, y - 50, 24);
    if (this.phase === 'to-dest1' && !this.veh.hasCargo) {
      this.drawText('🐱', x, y - 72 + Math.sin(this.time.now / 350) * 4, 22);
      this.drawText('RESCUE!', x, y + 64, 11, '#e65100', 'bold');
    }
  }

  drawHospital(wy) {
    this.drawBuilding(this.w / 2 + (this.roadW || ROAD_W) / 2 + 52 * (this.S || 1), wy, 0xef5350, 0xffffff, 'HOSPITAL', '🚑', '✚', '#b71c1c');
  }

  drawVet(wy) {
    this.drawBuilding(this.w / 2 + (this.roadW || ROAD_W) / 2 + 52 * (this.S || 1), wy, 0x2e7d32, 0xf1f8e9, 'VET CLINIC', '🐱', '🐾', '#1b5e20');
  }

  drawJail(wy) {
    const x = this.w / 2 + (this.roadW || ROAD_W) / 2 + 52 * (this.S || 1);
    const y = this.sy(wy);
    if (y < -150 || y > this.h + 100) return;
    this.drawBuilding(x, wy, 0x37474f, 0xeceff1, 'JAIL', this.veh.hasCargo ? '😬' : '⭐', '▥', '#263238');
  }

  drawBuilding(x, wy, roofColor, wallColor, label, topIcon, centerIcon, textColor) {
    const y = this.sy(wy);
    if (y < -150 || y > this.h + 100) return;
    this.g.fillStyle(roofColor, 1);
    this.g.fillRoundedRect(x - 42, y - 92, 84, 18, 4);
    this.g.fillStyle(wallColor, 1);
    this.g.fillRoundedRect(x - 42, y - 74, 84, 74, 3);
    this.g.lineStyle(2.5, 0xdddddd, 1);
    this.g.strokeRoundedRect(x - 42, y - 74, 84, 74, 3);
    this.g.fillStyle(0xb3e5fc, 1);
    this.g.fillRect(x - 30, y - 64, 14, 11);
    this.g.fillRect(x - 5, y - 64, 14, 11);
    this.g.fillRect(x + 16, y - 64, 14, 11);
    this.drawText(centerIcon, x, y - 40, 26);
    this.drawText(topIcon, x, y - 84, 16);
    this.drawText(label, x, y + 12, 11, textColor, 'bold');
  }

  drawBadGuy() {
    if (this.badGuy.caught) return;
    const x = this.sx(this.badGuy.x);
    const y = this.sy(this.badGuy.y);
    if (y < -60 || y > this.h + 60) return;
    const S = this.S || 1;
    this.drawCarBody(x, y, this.badGuy.angle, 28 * S, 44 * S, 0xffd600, 0xf9a825, '💀');
    this.drawText('!', x, y - 38 + Math.sin(this.time.now / 280) * 5, 20, '#ff1744', 'bold');
  }

  drawObstacle(ob) {
    const x = this.sx(ob.x);
    const y = this.sy(ob.y) + Math.sin(this.time.now / 500 + ob.wobble) * 2;
    if (y < -40 || y > this.h + 40) return;
    this.g.fillStyle(0x5d3a1a, 1);
    this.g.fillCircle(x, y, 14 * (this.S || 1));
    this.g.fillStyle(0x2e7d32, 1);
    this.g.fillCircle(x, y - 10 * (this.S || 1), 12 * (this.S || 1));
  }

  drawVehicle() {
    if (this.veh.invincible > 0 && Math.floor(this.veh.invincible / 4) % 2 === 0) return;
    const x = this.sx(this.veh.x);
    const y = this.sy(this.veh.y);
    if (mode === 'ambulance') this.drawAmbulance(x, y);
    else if (mode === 'firetruck') this.drawFiretruck(x, y);
    else this.drawPoliceCar(x, y);
  }

  drawAmbulance(x, y) {
    const S = this.S || 1;
    this.drawCarBody(x, y, this.veh.angle, 36 * S, 56 * S, 0xffffff, 0xcccccc, this.veh.hasCargo ? '😊' : '✚');
    this.drawLightBar(x, y, 36 * S, '#ef5350', '#42a5f5');
  }

  drawFiretruck(x, y) {
    const S = this.S || 1;
    this.drawCarBody(x, y, this.veh.angle, 40 * S, 62 * S, 0xd32f2f, 0xb71c1c, this.veh.hasCargo ? '🐱' : '🔥');
    this.drawLightBar(x, y, 40 * S, '#ef5350', '#42a5f5');
  }

  drawPoliceCar(x, y) {
    const S = this.S || 1;
    this.drawCarBody(x, y, this.veh.angle, 36 * S, 56 * S, 0x1a237e, 0x0d47a1, this.veh.hasCargo ? '😬' : '★');
    this.drawLightBar(x, y, 36 * S, '#ef5350', '#42a5f5');
  }

  drawCarBody(x, y, angle, w, h, fill, stroke, icon) {
    this.g.save();
    this.g.translateCanvas(x, y);
    this.g.rotateCanvas(angle);
    this.g.fillStyle(0x000000, 0.18);
    this.g.fillEllipse(2, 6, w + 6, h / 2.5);
    this.g.fillStyle(fill, 1);
    this.g.fillRoundedRect(-w / 2, -h / 2, w, h, 5);
    this.g.lineStyle(2, stroke, 1);
    this.g.strokeRoundedRect(-w / 2, -h / 2, w, h, 5);
    this.g.fillStyle(0xb3e5fc, 1);
    this.g.fillRoundedRect(-w / 2 + 4, -h / 2 + 2, w - 8, 13, 3);
    this.g.fillStyle(0x333333, 1);
    this.g.fillRoundedRect(-w / 2 - 2, -h / 2 + 8, 8, 12, 2);
    this.g.fillRoundedRect(w / 2 - 6, -h / 2 + 8, 8, 12, 2);
    this.g.fillRoundedRect(-w / 2 - 2, h / 2 - 20, 8, 12, 2);
    this.g.fillRoundedRect(w / 2 - 6, h / 2 - 20, 8, 12, 2);
    this.g.restore();
    this.drawText(icon, x, y - 2 * (this.S || 1), 12);
  }

  drawLightBar(x, y, w, c1, c2) {
    const t = Math.floor(this.time.now / 180) % 2;
    const left = t === 0 ? hex(c1) : hex(c2);
    const right = t === 0 ? hex(c2) : hex(c1);
    const cos = Math.cos(this.veh.angle);
    const sin = Math.sin(this.veh.angle);
    const S = this.S || 1;
    const ly = -34 * S;
    const lx1 = -w / 4;
    const lx2 = w / 4;
    this.g.fillStyle(left, 1);
    this.g.fillCircle(x + lx1 * cos - ly * sin, y + lx1 * sin + ly * cos, 5 * S);
    this.g.fillStyle(right, 1);
    this.g.fillCircle(x + lx2 * cos - ly * sin, y + lx2 * sin + ly * cos, 5 * S);
  }

  drawArrow() {
    const targetY = mode === 'police' && this.phase === 'to-dest1'
      ? this.badGuy.y
      : (this.phase === 'to-dest1' ? DEST1_Y : DEST2_Y);
    const sY = this.sy(targetY);
    const S = this.S || 1;
    if (sY > 60 * S && sY < this.h - 60 * S) return;
    const ay = sY < 60 * S ? 70 * S : this.h - 70 * S;
    const dir = sY < 60 ? -1 : 1;
    const pulse = 0.85 + Math.sin(this.time.now / 280) * 0.15;
    const color = this.phase === 'to-dest1' ? MODES[mode].arrow1 : MODES[mode].arrow2;
    const x = this.w / 2;

    this.g.fillStyle(color, 1);
    this.g.lineStyle(2 * S, 0x000000, 0.3);
    this.g.beginPath();
    this.g.moveTo(x, ay + dir * -22 * S * pulse);
    this.g.lineTo(x + 14 * S * pulse, ay);
    this.g.lineTo(x + 6 * S * pulse, ay);
    this.g.lineTo(x + 6 * S * pulse, ay + dir * 18 * S * pulse);
    this.g.lineTo(x - 6 * S * pulse, ay + dir * 18 * S * pulse);
    this.g.lineTo(x - 6 * S * pulse, ay);
    this.g.lineTo(x - 14 * S * pulse, ay);
    this.g.closePath();
    this.g.fillPath();
    this.g.strokePath();
    this.drawText(Math.round(Math.abs(targetY - this.veh.y) / 30) + 'm', x, ay + 38 * S, 11, '#fff', 'bold');
  }

  drawFlash() {
    if (this.flash <= 0) return;
    this.g.fillStyle(0xff2828, this.flash / 20 * 0.4);
    this.g.fillRect(0, 0, this.w, this.h);
  }

  drawText(text, x, y, size, color, weight) {
    const S = this.S || 1;
    const label = this.add.text(x, y, text, {
      fontFamily: 'Comic Sans MS, Chalkboard SE, cursive',
      fontSize: Math.round(size * S) + 'px',
      fontStyle: weight === 'bold' ? 'bold' : 'normal',
      color: color || '#000'
    }).setOrigin(0.5);
    label.setDepth(10);
    this.labels.push(label);
  }
}

const initialSize = gameSize();
new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game-root',
  width: initialSize.width,
  height: initialSize.height,
  backgroundColor: '#5aa030',
  scale: {
    mode: Phaser.Scale.NONE,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  render: {
    antialias: true,
    pixelArt: false
  },
  scene: HeroScene
});

function pickVehicle(nextMode) {
  mode = nextMode;
  initAudio();
  applyModeStyle();
  refreshJoystickColor();
  picker.style.display = 'none';
  heroScene.startGame(true);
}

document.getElementById('btn-amb').addEventListener('click', () => pickVehicle('ambulance'));
document.getElementById('btn-fire').addEventListener('click', () => pickVehicle('firetruck'));
document.getElementById('btn-police').addEventListener('click', () => pickVehicle('police'));
hornBtn.addEventListener('pointerdown', event => {
  event.preventDefault();
  honkHorn();
});
ovBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  if (heroScene) heroScene.startGame(false);
});
document.getElementById('change-vehicle').addEventListener('click', () => {
  overlay.style.display = 'none';
  picker.style.display = 'flex';
  if (heroScene) heroScene.running = false;
});

applyModeStyle();
setupJoystick();
let joystickResizeTimer = null;
window.addEventListener('resize', () => {
  window.clearTimeout(joystickResizeTimer);
  joystickResizeTimer = window.setTimeout(refreshJoystickColor, 120);
});
window.heroDebug = {
  get scene() { return heroScene; },
  get joystick() { return joystick; },
  get joy() { return joy; },
  setJoy(dx, dy) { joy.dx = dx; joy.dy = dy; },
  pickVehicle,
  honkHorn,
  playPickup,
  playDeliver,
  playHit
};
document.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
})();
</script>
