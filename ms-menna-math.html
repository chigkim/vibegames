<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math with Ms. Menna!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8F0;
    --warm-white: #FFFCF8;
    --peach: #FFD6B0;
    --orange: #FF8C42;
    --soft-orange: #FFA96A;
    --gold: #FFD166;
    --star-gold: #F4C430;
    --brown: #8B5E3C;
    --dark-brown: #5C3D1E;
    --pink: #FFB3C6;
    --soft-pink: #FFD6E0;
    --green: #6BCB77;
    --dark-green: #3A9E47;
    --sky: #A8DAFF;
    --purple: #C9B8FF;
    --red: #FF6B6B;
    --text: #3D2B1F;
    --shadow: rgba(139,94,60,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    padding: 20px 0 40px;
  }

  /* Bubbly background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 10% 20%, #FFE4C4 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, #FFD6E0 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, #FFF0D6 0%, transparent 60%);
    z-index: 0;
  }

  .floating-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    opacity: 0.25;
    animation: floatBubble linear infinite;
  }

  @keyframes floatBubble {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.25; }
    90% { opacity: 0.25; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* ===== SCREENS ===== */
  .screen {
    position: relative;
    z-index: 1;
    width: min(520px, 96vw);
    display: none;
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }

  .screen.active { display: block; }

  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* ===== CARD ===== */
  .card {
    background: var(--warm-white);
    border-radius: 32px;
    padding: 36px 32px 32px;
    box-shadow: 0 8px 40px var(--shadow), 0 2px 0 #fff inset;
    border: 3px solid #FFE0C0;
    text-align: center;
  }

  /* ===== POMERANIAN SVG ===== */
  .pom-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 12px;
  }

  .pom-container {
    position: relative;
    width: 130px;
    height: 130px;
  }

  .pom-container svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 6px 16px rgba(139,94,60,0.22));
  }

  .pom-container.bounce {
    animation: pomBounce 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes pomBounce {
    0% { transform: scale(1); }
    40% { transform: scale(1.18) rotate(-5deg); }
    70% { transform: scale(0.95) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .pom-container.shake {
    animation: pomShake 0.5s ease;
  }

  @keyframes pomShake {
    0%,100% { transform: rotate(0deg); }
    20% { transform: rotate(-8deg); }
    40% { transform: rotate(8deg); }
    60% { transform: rotate(-6deg); }
    80% { transform: rotate(6deg); }
  }

  /* ===== SPEECH BUBBLE ===== */
  .speech-bubble {
    background: white;
    border: 3px solid var(--peach);
    border-radius: 20px;
    padding: 14px 20px;
    margin: 0 0 20px;
    position: relative;
    font-size: 1.05rem;
    color: var(--text);
    line-height: 1.5;
    font-weight: 600;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .speech-bubble::before {
    content: '';
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    border: 10px solid transparent;
    border-bottom-color: var(--peach);
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-bottom-color: white;
  }

  /* ===== TITLE ===== */
  h1 {
    font-family: 'Baloo 2', cursive;
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--dark-brown);
    line-height: 1.1;
    margin-bottom: 6px;
  }

  h1 span { color: var(--orange); }

  .subtitle {
    font-size: 1rem;
    color: var(--brown);
    margin-bottom: 28px;
    font-weight: 600;
  }

  /* ===== BUTTONS ===== */
  .btn {
    display: inline-block;
    padding: 14px 36px;
    border-radius: 50px;
    border: none;
    font-family: 'Baloo 2', cursive;
    font-size: 1.25rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.12);
    letter-spacing: 0.02em;
  }

  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 rgba(0,0,0,0.12); }

  .btn-primary {
    background: linear-gradient(135deg, var(--orange), var(--soft-orange));
    color: white;
    width: 100%;
    margin-top: 8px;
  }

  .btn-answer {
    background: linear-gradient(135deg, var(--sky), #7EC8E3);
    color: var(--dark-brown);
    font-size: 1.5rem;
    padding: 10px 0;
    width: 72px;
    height: 72px;
    border-radius: 18px;
    box-shadow: 0 5px 0 #5AABCC;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-answer:hover { background: linear-gradient(135deg, #7EC8E3, var(--sky)); }

  /* ===== QUESTION AREA ===== */
  .question-box {
    background: linear-gradient(135deg, #FFF5E4, #FFF0F5);
    border: 3px solid var(--peach);
    border-radius: 24px;
    padding: 24px 20px 20px;
    margin: 0 0 20px;
  }

  .question-text {
    font-family: 'Baloo 2', cursive;
    font-size: 3.2rem;
    font-weight: 800;
    color: var(--dark-brown);
    margin-bottom: 18px;
    letter-spacing: -0.02em;
  }

  .answer-input-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .answer-input {
    width: 110px;
    height: 64px;
    border: 3px solid var(--peach);
    border-radius: 16px;
    font-family: 'Baloo 2', cursive;
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    color: var(--dark-brown);
    background: white;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .answer-input:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 4px rgba(255,140,66,0.15);
  }

  .answer-input.correct { border-color: var(--green); background: #F0FFF3; }
  .answer-input.wrong { border-color: var(--red); background: #FFF0F0; }

  /* ===== NUMBER PAD ===== */
  .numpad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 16px;
  }

  .numpad-btn {
    background: white;
    border: 2.5px solid var(--peach);
    border-radius: 14px;
    font-family: 'Baloo 2', cursive;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--dark-brown);
    padding: 10px 0;
    cursor: pointer;
    transition: background 0.1s, transform 0.1s;
    box-shadow: 0 3px 0 #EEC89A;
  }

  .numpad-btn:hover { background: var(--soft-pink); transform: translateY(-1px); }
  .numpad-btn:active { transform: translateY(2px); box-shadow: none; }

  .numpad-btn.del { background: #FFE4E4; border-color: #FFBBBB; box-shadow: 0 3px 0 #FFAAAA; }
  .numpad-btn.check { background: linear-gradient(135deg, var(--green), #52C95F); color: white; border-color: var(--dark-green); box-shadow: 0 3px 0 var(--dark-green); grid-column: span 2; }
  .numpad-btn.check:hover { background: linear-gradient(135deg, #52C95F, var(--green)); }

  /* ===== STARS ===== */
  .stars-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
  }

  .star-icon {
    font-size: 1.8rem;
    transition: transform 0.3s;
    filter: drop-shadow(0 2px 4px rgba(244,196,48,0.4));
  }

  .star-icon.earned { animation: starPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  @keyframes starPop {
    0% { transform: scale(0) rotate(-30deg); }
    60% { transform: scale(1.3) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .stars-label {
    font-family: 'Baloo 2', cursive;
    font-size: 1rem;
    font-weight: 700;
    color: var(--brown);
    margin-left: 6px;
  }

  /* ===== PROGRESS BAR ===== */
  .progress-wrap {
    background: #F0E0CC;
    border-radius: 20px;
    height: 14px;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--orange), var(--gold));
    border-radius: 20px;
    transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* ===== RESULT FLASH ===== */
  .result-flash {
    font-family: 'Baloo 2', cursive;
    font-size: 1.5rem;
    font-weight: 800;
    min-height: 36px;
    margin-bottom: 4px;
    transition: opacity 0.3s;
  }

  .result-flash.correct-msg { color: var(--dark-green); }
  .result-flash.wrong-msg { color: var(--red); }

  /* ===== CELEBRATION ===== */
  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  .confetti-piece {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ===== END SCREEN ===== */
  .trophy {
    font-size: 5rem;
    animation: trophyFloat 2s ease-in-out infinite;
    display: block;
    margin: 0 auto 12px;
  }

  @keyframes trophyFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .final-score {
    font-family: 'Baloo 2', cursive;
    font-size: 2rem;
    font-weight: 800;
    color: var(--dark-brown);
    margin-bottom: 6px;
  }

  .final-stars {
    font-size: 2.2rem;
    letter-spacing: 4px;
    margin-bottom: 20px;
  }

  .medal-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .medal {
    background: var(--soft-pink);
    border-radius: 16px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--dark-brown);
    border: 2px solid var(--pink);
  }

  /* ===== ROUND INDICATOR ===== */
  .round-indicator {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--brown);
    margin-bottom: 12px;
  }

  /* ===== NAME INPUT ===== */
  .name-input {
    width: 100%;
    padding: 14px 20px;
    border: 3px solid var(--peach);
    border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    text-align: center;
    color: var(--dark-brown);
    background: white;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  .name-input:focus { border-color: var(--orange); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 400px) {
    .card { padding: 28px 20px 24px; }
    h1 { font-size: 2rem; }
    .question-text { font-size: 2.6rem; }
  }
</style>
</head>
<body>

<!-- Floating background bubbles -->
<div class="floating-bg" id="floatingBg"></div>

<!-- Confetti container -->
<div class="confetti-wrap" id="confettiWrap"></div>

<!-- ===== WELCOME SCREEN ===== -->
<div class="screen active" id="welcomeScreen">
  <div class="card">
    <div class="pom-wrap">
      <div class="pom-container" id="pomWelcome">
        <!-- Pomeranian SVG -->
        <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <!-- Body fluff -->
          <ellipse cx="65" cy="85" rx="38" ry="30" fill="#E8A85A"/>
          <!-- Fluffy body details -->
          <ellipse cx="40" cy="88" rx="14" ry="12" fill="#F0B870"/>
          <ellipse cx="90" cy="88" rx="14" ry="12" fill="#F0B870"/>
          <ellipse cx="65" cy="100" rx="20" ry="12" fill="#F0B870"/>
          <!-- Tail -->
          <ellipse cx="100" cy="68" rx="14" ry="10" fill="#E8A85A" transform="rotate(-30 100 68)"/>
          <ellipse cx="108" cy="62" rx="10" ry="7" fill="#F0B870" transform="rotate(-30 108 62)"/>
          <!-- Neck fluff -->
          <ellipse cx="65" cy="70" rx="22" ry="14" fill="#F5C27A"/>
          <!-- Head -->
          <ellipse cx="65" cy="52" rx="26" ry="24" fill="#E8A85A"/>
          <!-- Head fluff sides -->
          <ellipse cx="36" cy="52" rx="12" ry="16" fill="#F0B870"/>
          <ellipse cx="94" cy="52" rx="12" ry="16" fill="#F0B870"/>
          <ellipse cx="38" cy="44" rx="9" ry="12" fill="#F5C27A"/>
          <ellipse cx="92" cy="44" rx="9" ry="12" fill="#F5C27A"/>
          <!-- Ears -->
          <ellipse cx="46" cy="31" rx="10" ry="12" fill="#D4924A"/>
          <ellipse cx="84" cy="31" rx="10" ry="12" fill="#D4924A"/>
          <ellipse cx="46" cy="32" rx="6" ry="8" fill="#E8A85A"/>
          <ellipse cx="84" cy="32" rx="6" ry="8" fill="#E8A85A"/>
          <!-- Face -->
          <ellipse cx="65" cy="56" rx="18" ry="16" fill="#F5C27A"/>
          <!-- Eyes -->
          <circle cx="57" cy="50" r="5" fill="#3D2B1F"/>
          <circle cx="73" cy="50" r="5" fill="#3D2B1F"/>
          <circle cx="59" cy="48" r="2" fill="white"/>
          <circle cx="75" cy="48" r="2" fill="white"/>
          <!-- Nose -->
          <ellipse cx="65" cy="58" rx="5" ry="3.5" fill="#3D2B1F"/>
          <ellipse cx="64" cy="57" rx="1.5" ry="1" fill="white" opacity="0.6"/>
          <!-- Mouth -->
          <path d="M 61 62 Q 65 66 69 62" stroke="#3D2B1F" stroke-width="2" fill="none" stroke-linecap="round"/>
          <!-- Cheeks -->
          <circle cx="51" cy="57" r="5" fill="#FFB3C6" opacity="0.5"/>
          <circle cx="79" cy="57" r="5" fill="#FFB3C6" opacity="0.5"/>
          <!-- Graduation cap -->
          <rect x="48" y="32" width="34" height="5" rx="2" fill="#3D2B1F"/>
          <polygon points="65,22 48,32 82,32" fill="#3D2B1F"/>
          <line x1="82" y1="32" x2="88" y2="40" stroke="#FFD166" stroke-width="2.5"/>
          <circle cx="88" cy="42" r="3" fill="#FFD166"/>
          <!-- Legs -->
          <rect x="50" y="108" width="12" height="16" rx="6" fill="#D4924A"/>
          <rect x="68" y="108" width="12" height="16" rx="6" fill="#D4924A"/>
          <ellipse cx="56" cy="124" rx="8" ry="4" fill="#C0824A"/>
          <ellipse cx="74" cy="124" rx="8" ry="4" fill="#C0824A"/>
          <!-- Teacher pointer (paw holding it) -->
          <line x1="30" y1="90" x2="18" y2="65" stroke="#8B5E3C" stroke-width="3" stroke-linecap="round"/>
          <circle cx="18" cy="63" r="3" fill="#FFD166"/>
        </svg>
      </div>
    </div>

    <h1>Math with<br><span>Ms. Menna!</span> 🐾</h1>
    <p class="subtitle">Your Pomeranian math teacher</p>
    <p style="font-size:11px;opacity:0.4;font-family:monospace;margin-bottom:4px;">v1</p>

    <div class="speech-bubble" id="welcomeBubble">
      Woof woof! I'm Ms. Menna, your math teacher! What's your name, friend?
    </div>

    <input class="name-input" type="text" id="nameInput" placeholder="Type your name here!" maxlength="20" autocomplete="off"/>
    <button class="btn btn-primary" onclick="startGame()">Let's Learn! ⭐</button>
  </div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div class="screen" id="gameScreen">
  <div class="card" style="position:relative;">
    <div style="position:absolute;top:10px;right:14px;font-size:11px;opacity:0.35;font-family:monospace;">v1</div>
    <div class="pom-wrap">
      <div class="pom-container" id="pomGame">
        <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="65" cy="85" rx="38" ry="30" fill="#E8A85A"/>
          <ellipse cx="40" cy="88" rx="14" ry="12" fill="#F0B870"/>
          <ellipse cx="90" cy="88" rx="14" ry="12" fill="#F0B870"/>
          <ellipse cx="65" cy="100" rx="20" ry="12" fill="#F0B870"/>
          <ellipse cx="100" cy="68" rx="14" ry="10" fill="#E8A85A" transform="rotate(-30 100 68)"/>
          <ellipse cx="108" cy="62" rx="10" ry="7" fill="#F0B870" transform="rotate(-30 108 62)"/>
          <ellipse cx="65" cy="70" rx="22" ry="14" fill="#F5C27A"/>
          <ellipse cx="65" cy="52" rx="26" ry="24" fill="#E8A85A"/>
          <ellipse cx="36" cy="52" rx="12" ry="16" fill="#F0B870"/>
          <ellipse cx="94" cy="52" rx="12" ry="16" fill="#F0B870"/>
          <ellipse cx="38" cy="44" rx="9" ry="12" fill="#F5C27A"/>
          <ellipse cx="92" cy="44" rx="9" ry="12" fill="#F5C27A"/>
          <ellipse cx="46" cy="31" rx="10" ry="12" fill="#D4924A"/>
          <ellipse cx="84" cy="31" rx="10" ry="12" fill="#D4924A"/>
          <ellipse cx="46" cy="32" rx="6" ry="8" fill="#E8A85A"/>
          <ellipse cx="84" cy="32" rx="6" ry="8" fill="#E8A85A"/>
          <ellipse cx="65" cy="56" rx="18" ry="16" fill="#F5C27A"/>
          <circle cx="57" cy="50" r="5" fill="#3D2B1F"/>
          <circle cx="73" cy="50" r="5" fill="#3D2B1F"/>
          <circle cx="59" cy="48" r="2" fill="white"/>
          <circle cx="75" cy="48" r="2" fill="white"/>
          <ellipse cx="65" cy="58" rx="5" ry="3.5" fill="#3D2B1F"/>
          <ellipse cx="64" cy="57" rx="1.5" ry="1" fill="white" opacity="0.6"/>
          <path d="M 61 62 Q 65 66 69 62" stroke="#3D2B1F" stroke-width="2" fill="none" stroke-linecap="round" id="mouthGame"/>
          <circle cx="51" cy="57" r="5" fill="#FFB3C6" opacity="0.5"/>
          <circle cx="79" cy="57" r="5" fill="#FFB3C6" opacity="0.5"/>
          <rect x="48" y="32" width="34" height="5" rx="2" fill="#3D2B1F"/>
          <polygon points="65,22 48,32 82,32" fill="#3D2B1F"/>
          <line x1="82" y1="32" x2="88" y2="40" stroke="#FFD166" stroke-width="2.5"/>
          <circle cx="88" cy="42" r="3" fill="#FFD166"/>
          <rect x="50" y="108" width="12" height="16" rx="6" fill="#D4924A"/>
          <rect x="68" y="108" width="12" height="16" rx="6" fill="#D4924A"/>
          <ellipse cx="56" cy="124" rx="8" ry="4" fill="#C0824A"/>
          <ellipse cx="74" cy="124" rx="8" ry="4" fill="#C0824A"/>
          <line x1="30" y1="90" x2="18" y2="65" stroke="#8B5E3C" stroke-width="3" stroke-linecap="round"/>
          <circle cx="18" cy="63" r="3" fill="#FFD166"/>
        </svg>
      </div>
    </div>

    <div class="speech-bubble" id="gameBubble">Let's do some math! 🌟</div>

    <div class="stars-row" id="starsRow">
      <span id="starDisplay">⭐ <span id="starCount">0</span> stars</span>
    </div>

    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>

    <div class="round-indicator" id="roundIndicator">Question 1 of 10</div>

    <div class="question-box">
      <div class="question-text" id="questionText">3 + 4 = ?</div>
      <div class="answer-input-wrap">
        <input class="answer-input" type="text" id="answerInput" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="?"/>
      </div>
    </div>

    <div class="result-flash" id="resultFlash"></div>

    <div class="numpad">
      <button class="numpad-btn" onclick="numPad('1')">1</button>
      <button class="numpad-btn" onclick="numPad('2')">2</button>
      <button class="numpad-btn" onclick="numPad('3')">3</button>
      <button class="numpad-btn del" onclick="numPad('del')">⌫</button>
      <button class="numpad-btn" onclick="numPad('4')">4</button>
      <button class="numpad-btn" onclick="numPad('5')">5</button>
      <button class="numpad-btn" onclick="numPad('6')">6</button>
      <button class="numpad-btn" onclick="numPad('7')">7</button>
      <button class="numpad-btn" onclick="numPad('8')">8</button>
      <button class="numpad-btn" onclick="numPad('9')">9</button>
      <button class="numpad-btn" onclick="numPad('0')">0</button>
      <button class="numpad-btn" onclick="numPad('del')" style="background:#FFE4E4;border-color:#FFBBBB;box-shadow:0 3px 0 #FFAAAA;">⌫</button>
    </div>
    <button class="numpad-btn check" onclick="submitAnswer()" style="width:100%;margin-top:10px;padding:16px;font-size:1.4rem;border-radius:18px;">✔ Check My Answer!</button>
  </div>
</div>

<!-- ===== END SCREEN ===== -->
<div class="screen" id="endScreen">
  <div class="card">
    <span class="trophy" id="trophyEmoji">🏆</span>
    <div class="speech-bubble" id="endBubble">Amazing work!</div>
    <div class="final-score" id="finalScore">You got 8 out of 10!</div>
    <div class="final-stars" id="finalStars">⭐⭐⭐⭐⭐</div>
    <div class="medal-row" id="medalRow"></div>
    <button class="btn btn-primary" onclick="playAgain()">Play Again! 🐾</button>
  </div>
</div>

<script>
  // ===== FLOATING BUBBLES =====
  const bubbleColors = ['#FFD6B0','#FFB3C6','#A8DAFF','#C9B8FF','#FFD166','#B5EAD7'];
  const bg = document.getElementById('floatingBg');
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 20 + Math.random() * 50;
    b.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      background:${bubbleColors[Math.floor(Math.random()*bubbleColors.length)]};
      animation-duration:${8+Math.random()*12}s;
      animation-delay:${-Math.random()*15}s;
    `;
    bg.appendChild(b);
  }

  // ===== TEXT TO SPEECH (Safari/iOS safe) =====
  let ttsReady = false;

  // iOS Safari requires speechSynthesis to be triggered inside a user gesture.
  // We unlock it on the very first tap anywhere on the page.
  function unlockTTS() {
    if (ttsReady) return;
    ttsReady = true;
    const utt = new SpeechSynthesisUtterance('');
    utt.volume = 0;
    window.speechSynthesis.speak(utt);
  }
  document.addEventListener('touchstart', unlockTTS, { once: true });
  document.addEventListener('click', unlockTTS, { once: true });

  function getVoice() {
    const voices = window.speechSynthesis.getVoices();
    return (
      voices.find(v => v.name === 'Samantha') ||
      voices.find(v => v.name === 'Karen') ||
      voices.find(v => v.name === 'Moira') ||
      voices.find(v => v.name.includes('Samantha')) ||
      voices.find(v => v.lang === 'en-US') ||
      voices.find(v => v.lang.startsWith('en')) ||
      null
    );
  }

  function stripEmoji(text) {
    return text
      .replace(/[\u{1F300}-\u{1FAFF}]/gu, '')
      .replace(/[\u{2600}-\u{27BF}]/gu, '')
      .replace(/[\u{FE00}-\u{FEFF}]/gu, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    const clean = stripEmoji(text);
    if (!clean) return;
    // Cancel any ongoing speech
    window.speechSynthesis.cancel();
    // Small delay needed on iOS after cancel()
    setTimeout(function() {
      const utt = new SpeechSynthesisUtterance(clean);
      utt.lang = 'en-US';
      utt.rate = 0.95;
      utt.pitch = 1.15;
      utt.volume = 1;
      const voice = getVoice();
      if (voice) utt.voice = voice;
      window.speechSynthesis.speak(utt);
    }, 50);
  }

  // ===== GAME STATE =====
  let playerName = '';
  let currentQuestion = 0;
  let stars = 0;
  let correctAnswers = 0;
  let totalQuestions = 10;
  let currentAnswer = 0;
  let answered = false;
  let wrongStreak = 0;

  const correctMessages = [
    "Woof woof! That's right! 🎉",
    "You're so smart! ⭐",
    "Amazing! Ms. Menna is so proud! 🐾",
    "YES! Great job! 🌟",
    "Pawsome answer! 🐶",
    "That's correct! You're on fire! 🔥",
    "Brilliant! Keep going! ✨",
    "Woohoo! Perfect! 🎊",
    "Ms. Menna does a happy spin! 🌀⭐",
    "You're a math star! ⭐"
  ];

  const wrongMessages = [
    "Oops! The answer was {ans}. Try the next one! 💪",
    "Not quite! It was {ans}. You've got this! 🐾",
    "Hmm, {ans} was the answer. Keep trying! 🌟",
    "So close! The answer was {ans}. Don't give up! 🐶",
    "That's okay! {ans} was right. Next one! 💫"
  ];

  const questionPrompts = [
    "Can you solve this one, {name}?",
    "Here's your next question, {name}! 🌟",
    "You're doing great, {name}! Try this:",
    "Math time, {name}! 🐾",
    "Ready for this one, {name}?",
    "Let's go, {name}! 🎯",
    "Almost there, {name}! Here we go:",
    "You've got this, {name}! 💪"
  ];

  function generateQuestion() {
    const type = Math.random() < 0.55 ? 'add' : 'sub';
    let a, b, answer;
    if (type === 'add') {
      a = Math.floor(Math.random() * 18) + 1;
      b = Math.floor(Math.random() * (20 - a)) + 1;
      answer = a + b;
      return { text: `${a} + ${b} = ?`, answer };
    } else {
      a = Math.floor(Math.random() * 18) + 2;
      b = Math.floor(Math.random() * (a - 1)) + 1;
      answer = a - b;
      return { text: `${a} − ${b} = ?`, answer };
    }
  }

  function startGame() {
    const nameVal = document.getElementById('nameInput').value.trim();
    playerName = nameVal || 'Friend';
    currentQuestion = 0;
    stars = 0;
    correctAnswers = 0;
    wrongStreak = 0;
    answered = false;
    currentAnswer = 0;
    speak('Hi ' + playerName + '! I am Ms. Menna, your math teacher! Let us do some math!');
    showScreen('gameScreen');
    loadNextQuestion();
  }

  function loadNextQuestion() {
    answered = false;
    const inp = document.getElementById('answerInput');
    inp.value = '';
    inp.className = 'answer-input';
    document.getElementById('resultFlash').textContent = '';
    document.getElementById('resultFlash').className = 'result-flash';

    currentQuestion++;
    const q = generateQuestion();
    currentAnswer = q.answer;

    document.getElementById('questionText').textContent = q.text;
    document.getElementById('roundIndicator').textContent = `Question ${currentQuestion} of ${totalQuestions}`;

    const pct = ((currentQuestion - 1) / totalQuestions) * 100;
    document.getElementById('progressFill').style.width = pct + '%';

    const prompt = questionPrompts[Math.floor(Math.random() * questionPrompts.length)];
    const promptText = prompt.replace('{name}', playerName);
    document.getElementById('gameBubble').textContent = promptText;
    const qText = q.text.replace('−', 'minus').replace('+', 'plus').replace('=', 'equals');
    speak(promptText + ' ' + qText);

    updateStarDisplay();
    inp.focus();
  }

  function updateStarDisplay() {
    const row = document.getElementById('starsRow');
    if (!row) return;
    row.innerHTML = '';
    if (stars === 0) {
      row.innerHTML = '<span style="font-size:0.95rem;font-weight:700;color:#B0845A">Earn stars for correct answers!</span>';
    } else {
      for (let i = 0; i < stars; i++) {
        const s = document.createElement('span');
        s.textContent = '⭐';
        s.className = 'star-icon';
        row.appendChild(s);
      }
    }
  }

  function numPad(val) {
    if (answered) return;
    const inp = document.getElementById('answerInput');
    if (val === 'del') {
      inp.value = inp.value.slice(0, -1);
    } else {
      if (inp.value.length < 3) inp.value += val;
    }
  }

  function submitAnswer() {
    if (answered) return;
    const inp = document.getElementById('answerInput');
    const raw = (inp.value || '').trim();
    const userAns = parseInt(raw, 10);
    if (raw === '' || isNaN(userAns)) {
      document.getElementById('gameBubble').textContent = 'Pick a number first! 🐾';
      speak('Pick a number first!');
      inp.style.borderColor = '#FF8C42';
      setTimeout(() => { inp.style.borderColor = ''; }, 800);
      return;
    }
    answered = true;

    const flash = document.getElementById('resultFlash');
    const pom = document.getElementById('pomGame');

    if (userAns === currentAnswer) {
      correctAnswers++;
      stars++;
      wrongStreak = 0;
      inp.className = 'answer-input correct';
      flash.textContent = '+1 ⭐  Correct!';
      flash.className = 'result-flash correct-msg';
      const msg = correctMessages[Math.floor(Math.random() * correctMessages.length)];
      document.getElementById('gameBubble').textContent = msg;
      speak(msg);
      pom.classList.remove('bounce', 'shake');
      void pom.offsetWidth;
      pom.classList.add('bounce');
      launchConfetti(8);
    } else {
      wrongStreak++;
      inp.className = 'answer-input wrong';
      const msg = wrongMessages[Math.floor(Math.random() * wrongMessages.length)].replace('{ans}', currentAnswer);
      flash.textContent = 'The answer was ' + currentAnswer;
      flash.className = 'result-flash wrong-msg';
      document.getElementById('gameBubble').textContent = msg;
      speak(msg);
      pom.classList.remove('bounce', 'shake');
      void pom.offsetWidth;
      pom.classList.add('shake');
    }

    updateStarDisplay();

    setTimeout(function() {
      if (currentQuestion >= totalQuestions) {
        showEndScreen();
      } else {
        loadNextQuestion();
      }
    }, 1600);
  }

  function showEndScreen() {
    const pct = correctAnswers / totalQuestions;
    let trophy = '🏆';
    let message = '';
    let starsDisplay = '⭐'.repeat(stars);

    if (pct === 1) {
      trophy = '🏆✨';
      message = `PERFECT SCORE! ${playerName}, you're a math genius! Ms. Menna is SO proud! 🐾🌟`;
    } else if (pct >= 0.8) {
      trophy = '🏆';
      message = `Incredible work, ${playerName}! You're a real math star! 🌟`;
    } else if (pct >= 0.6) {
      trophy = '🥈';
      message = `Great job, ${playerName}! You're getting better every day! Keep practicing! 💪`;
    } else {
      trophy = '💪';
      message = `Good effort, ${playerName}! Math takes practice, and you're doing it! 🐾`;
    }

    document.getElementById('trophyEmoji').textContent = trophy;
    document.getElementById('endBubble').textContent = message;
    document.getElementById('finalScore').textContent = `You got ${correctAnswers} out of ${totalQuestions}!`;
    document.getElementById('finalStars').textContent = starsDisplay || '(Keep trying for stars!)';

    // Medals
    const medals = [];
    if (pct === 1) medals.push('🌟 PERFECT!');
    if (correctAnswers >= 8) medals.push('🏅 Math Superstar');
    if (correctAnswers >= 5) medals.push('📚 Hardworking');
    medals.push(`⭐ ${stars} Stars Earned`);
    const medalRow = document.getElementById('medalRow');
    medalRow.innerHTML = medals.map(m => `<div class="medal">${m}</div>`).join('');

    showScreen('endScreen');
    speak(message + ' You got ' + correctAnswers + ' out of ' + totalQuestions + '!');
    if (pct >= 0.8) launchConfetti(30);
  }

  function playAgain() {
    window.speechSynthesis.cancel();
    showScreen('welcomeScreen');
    document.getElementById('nameInput').value = '';
    document.getElementById('welcomeBubble').textContent = `Welcome back! Ready for more math? 🐾⭐`;
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ===== CONFETTI =====
  function launchConfetti(count) {
    const wrap = document.getElementById('confettiWrap');
    const colors = ['#FF8C42','#FFD166','#6BCB77','#A8DAFF','#FFB3C6','#C9B8FF','#FF6B6B'];
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.cssText = `
        left:${10 + Math.random()*80}%;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        animation-duration:${1.5+Math.random()*2}s;
        animation-delay:${Math.random()*0.5}s;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        width:${8+Math.random()*10}px;
        height:${8+Math.random()*10}px;
      `;
      wrap.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  // ===== KEYBOARD SUPPORT =====
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('gameScreen').classList.contains('active')) {
      if (e.key === 'Enter') submitAnswer();
    }
  });

  document.getElementById('nameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startGame();
  });

  // Welcome Pom idle bounce
  setInterval(() => {
    const pom = document.getElementById('pomWelcome');
    if (pom) {
      pom.classList.remove('bounce');
      void pom.offsetWidth;
      pom.classList.add('bounce');
    }
  }, 4000);
</script>
</body>
</html>
