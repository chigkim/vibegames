<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rise! — Vibe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
    touch-action: none;
  }
  #game-root {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100vw;
    width: 100dvw;
    height: 100vh;
    height: 100dvh;
  }
  canvas {
    display: block;
    max-width: 100vw;
    max-width: 100dvw;
    max-height: 100vh;
    max-height: 100dvh;
    touch-action: none;
  }
  #ui-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    background: rgba(255,255,255,0.13);
    backdrop-filter: blur(18px);
    border-radius: 28px;
    padding: 40px 36px;
    border: 2px solid rgba(255,255,255,0.25);
    box-shadow: 0 12px 60px rgba(0,0,0,0.35);
    pointer-events: auto;
    max-width: 320px;
    width: 88vw;
    text-align: center;
  }
  .screen.active { display: flex; }
  .screen h1 {
    font-family: 'Bowlby One SC', 'DM Sans', sans-serif;
    font-size: 3.4rem;
    font-weight: 400;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #ffe066, #ff6b9d, #6bceff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }
  .screen .subtitle {
    font-size: 1.05rem;
    color: rgba(255,255,255,0.8);
    line-height: 1.5;
    font-weight: 500;
  }
  .screen .instructions {
    font-size: 0.92rem;
    color: rgba(255,255,255,0.65);
    background: rgba(0,0,0,0.18);
    border-radius: 14px;
    padding: 12px 16px;
    line-height: 1.65;
  }
  .btn {
    padding: 16px 44px;
    font-size: 1.2rem;
    font-weight: 800;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    letter-spacing: 0.5px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  .btn:active { transform: scale(0.96); }
  .btn-start { background: linear-gradient(135deg, #ffe066, #ff8c42); color: #1a0a00; }
  .btn-restart { background: linear-gradient(135deg, #6bceff, #a78bfa); color: #0a0020; }
  .score-display {
    font-size: 1.5rem;
    font-weight: 800;
    color: #ffe066;
  }
  .best-score {
    font-size: 1rem;
    color: rgba(255,255,255,0.6);
  }
  .guide-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,0,0,0.18);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 10px 16px;
    cursor: pointer;
    user-select: none;
    color: rgba(255,255,255,0.85);
    font-size: 0.95rem;
    font-weight: 600;
    transition: background 0.2s, border-color 0.2s;
  }
  .guide-toggle:hover {
    background: rgba(0,0,0,0.28);
    border-color: rgba(255,255,255,0.3);
  }
  .guide-toggle input {
    appearance: none;
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border: 2px solid rgba(255,255,255,0.45);
    border-radius: 6px;
    margin: 0;
    cursor: pointer;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .guide-toggle input:checked {
    background: linear-gradient(135deg, #ffe066, #ff8c42);
    border-color: #ffe066;
  }
  .guide-toggle input:checked::after {
    content: '✓';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -54%);
    color: #1a0a00;
    font-weight: 900;
    font-size: 16px;
    line-height: 1;
  }
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 18px 0;
    pointer-events: none;
    z-index: 5;
  }
  #hud-score {
    font-size: 2rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    letter-spacing: -0.5px;
  }
  #hud-combo {
    font-family: 'Bowlby One SC', 'DM Sans', sans-serif;
    font-size: 1.6rem;
    color: #ff6b9d;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4), 0 0 18px rgba(255,107,157,0.5);
    margin-top: 4px;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.18s ease, transform 0.18s cubic-bezier(.5,1.6,.4,1);
    pointer-events: none;
  }
  #hud-combo.visible {
    opacity: 1;
    transform: scale(1);
  }
  #hud-stars {
    font-family: 'Bowlby One SC', 'DM Sans', sans-serif;
    font-size: 1.3rem;
    color: #ffe066;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4), 0 0 14px rgba(255,224,102,0.6);
    margin-top: 3px;
    transition: transform 0.15s cubic-bezier(.5,1.6,.4,1);
  }
  #hud-stars.pop {
    transform: scale(1.45);
  }
  #hud-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  #mute-btn {
    pointer-events: auto;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    width: 44px; height: 44px;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
  }
  #mute-btn:active { transform: scale(0.9); }
  #hud.hidden { display: none; }
</style>
</head>
<body>

<div id="game-root"></div>

<div id="hud" class="hidden">
  <div id="hud-left">
    <div id="hud-score">🏆 0</div>
    <div id="hud-combo">x2</div>
    <div id="hud-stars" style="display:none;">⭐ 0</div>
  </div>
  <button id="mute-btn" aria-label="Toggle sound">🔊</button>
</div>

<div id="ui-overlay">
  <div id="screen-ready" class="screen active">
    <h1>RISE!</h1>
    <div class="subtitle">Swing from rope to rope and climb as high as you can! ☁️</div>
    <div class="instructions">
      🟡 <strong>Hold</strong> to grab a rope<br>
      🔵 <strong>Let go</strong> to release and fly!<br>
      ⭐ <strong>Grab stars</strong> to extend your catch window!<br>
      🚀 Climb as high as you can!
    </div>
    <div class="best-score" id="ready-best-score" style="display:none;">🏆 Best: 0</div>
    <label class="guide-toggle">
      <input type="checkbox" id="ready-guide-toggle">
      <span>🎯 Show landing guide</span>
    </label>
    <button class="btn btn-start" id="btn-start">Let's Go! 🎉</button>
  </div>

  <div id="screen-gameover" class="screen">
    <h1>Oh No! 😢</h1>
    <div class="subtitle" id="encourage-msg">Nice climb!</div>
    <div class="score-display" id="final-score">Score: 0</div>
    <div class="best-score" id="best-score-display">Best: 0</div>
    <label class="guide-toggle">
      <input type="checkbox" id="gameover-guide-toggle">
      <span>🎯 Show landing guide</span>
    </label>
    <button class="btn btn-restart" id="btn-restart">Play Again! 🔄</button>
  </div>
</div>

<script src="./libs/phaser-3.90.0.min.js"></script>
<script src="./libs/tone-15.1.22.js"></script>
<script src="./libs/zzfx-1.3.2.micro.min.js"></script>
<script>
// Game size adapts to the device viewport. Phones fill the screen, and tablets
// can use the wider landscape viewport instead of being capped to phone width.
// Internal game logic uses these dimensions directly (Phaser.Scale.NONE).
const GAME_MAX_WIDTH = 1280;
const GAME_MAX_HEIGHT = 1280;
const GRAVITY = 0.38;
const CATCH_RADIUS = 52;
const STAR_COLLECT_RADIUS = 38;
const MAGNETIC_RADIUS = 90;
const APEX_FLOAT_FRAMES = 120;  // frames (2s) of gravity suspension per star
const FALL_THRESHOLD = 300;
const COMBO_TIMEOUT_FRAMES = 90;  // 1.5s at 60fps to chain catches
const HUB_COLORS = ['#ff6b9d', '#ff8c42', '#ffe066', '#6bceff', '#a78bfa', '#5eead4', '#f472b6'];
const ROPE_COLORS = ['#c77dff', '#4cc9f0', '#f8961e', '#90e0ef', '#ff6b6b', '#b5e48c'];
const MILESTONES = [5, 10, 15, 25, 40, 60, 80, 100];

let muted = false;
let guideEnabled = false;
let audioReady = false;
let scoreSynth = null;
let gameOverSynth = null;
let starSynth = null;
let comboSynth = null;
let milestoneSynth = null;
let musicBed = null;
let musicPad = null;
let musicLoop = null;
let musicLevel = 0;
let audioBus = null;
let riseScene = null;
let pendingStartRequest = false;
let lastStartRequestAt = 0;

function gameSize() {
  const viewport = window.visualViewport || window;
  return {
    width: Math.min(Math.round(viewport.width || window.innerWidth), GAME_MAX_WIDTH),
    height: Math.min(Math.round(viewport.height || window.innerHeight), GAME_MAX_HEIGHT)
  };
}

function hexColor(hex) {
  return parseInt(hex.slice(1), 16);
}

function lerpColorInt(a, b, t) {
  const ar = (a >> 16) & 0xff, ag = (a >> 8) & 0xff, ab = a & 0xff;
  const br = (b >> 16) & 0xff, bg = (b >> 8) & 0xff, bb = b & 0xff;
  const rr = Math.round(ar + (br - ar) * t);
  const rg = Math.round(ag + (bg - ag) * t);
  const rb = Math.round(ab + (bb - ab) * t);
  return (rr << 16) | (rg << 8) | rb;
}

function loadBestScore() {
  try {
    return parseInt(localStorage.getItem('rise_best') || '0', 10) || 0;
  } catch {
    return 0;
  }
}

function saveBestScore(value) {
  try {
    localStorage.setItem('rise_best', value);
  } catch {
    // Storage can be unavailable in private browsing or restricted embeds.
  }
}

function loadGuidePref() {
  try {
    return localStorage.getItem('rise_guide') === '1';
  } catch {
    return false;
  }
}

function saveGuidePref(on) {
  try {
    localStorage.setItem('rise_guide', on ? '1' : '0');
  } catch {}
}

async function initAudio() {
  if (!window.Tone) return;
  if (!audioReady) {
    audioBus = new Tone.Volume(muted ? -Infinity : -8).toDestination();
    const sparkle = new Tone.FeedbackDelay({ delayTime: 0.07, feedback: 0.16, wet: 0.18 }).connect(audioBus);
    const reverb = new Tone.Reverb({ decay: 2.5, wet: 0.32 }).connect(audioBus);

    scoreSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'sine' },
      envelope: { attack: 0.005, decay: 0.09, sustain: 0.08, release: 0.08 }
    }).connect(sparkle);

    gameOverSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'fatsawtooth', count: 2, spread: 18 },
      envelope: { attack: 0.01, decay: 0.22, sustain: 0.1, release: 0.35 }
    }).connect(audioBus);

    // Sparkly star pickup chime
    starSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'triangle' },
      envelope: { attack: 0.001, decay: 0.06, sustain: 0.0, release: 0.05 }
    }).connect(sparkle);

    // Combo - bright bell-like
    comboSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'sine' },
      envelope: { attack: 0.001, decay: 0.18, sustain: 0.0, release: 0.18 }
    }).connect(reverb);

    // Milestone fanfare - rich pad
    milestoneSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: 'fatsine', count: 3, spread: 12 },
      envelope: { attack: 0.02, decay: 0.4, sustain: 0.2, release: 0.6 }
    }).connect(reverb);

    // Ambient pad bed - very quiet, intensifies with combo
    musicBed = new Tone.Volume(-Infinity).connect(audioBus);
    musicPad = new Tone.PolySynth(Tone.AMSynth, {
      harmonicity: 1.5,
      oscillator: { type: 'sine' },
      modulation: { type: 'sine' },
      envelope: { attack: 1.5, decay: 0.5, sustain: 0.7, release: 2.0 }
    }).connect(musicBed);

    audioReady = true;
  }

  try {
    await Tone.start();
    resumeZzfx();
  } catch {
    // Gameplay should continue even if the browser refuses audio startup.
  }
}

function resumeZzfx() {
  try {
    if (typeof zzfxX !== 'undefined' && zzfxX.state === 'suspended') zzfxX.resume();
  } catch {
    // ZzFX is optional; Tone handles the longer musical cues.
  }
}

function playArcadeSound(params) {
  if (muted) return;
  resumeZzfx();
  try {
    if (typeof zzfx === 'function') zzfx(...params);
  } catch {
    // Ignore audio failures so gameplay is never blocked.
  }
}

function setMuted(value) {
  muted = value;
  if (audioBus) audioBus.volume.value = muted ? -Infinity : -8;
  document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊';
}

function playSound(type, data) {
  if (muted) return;
  if (type === 'catch') {
    playArcadeSound([0.55, 0.05, 880, 0.01, 0.04, 0.09, 1, 1.6, 0.2]);
    return;
  }
  if (type === 'release') {
    playArcadeSound([0.45, 0.08, 260, 0.005, 0.05, 0.12, 2, 1, -0.25]);
    return;
  }
  if (type === 'goldcatch') {
    playArcadeSound([0.7, 0.05, 1320, 0.01, 0.08, 0.18, 1, 2.2, 0.3]);
    return;
  }
  if (type === 'starsave') {
    playArcadeSound([0.9, 0.06, 880, 0.005, 0.1, 0.32, 1, 2.2, 0.45]);
    if (!audioReady) return;
    const _now = Tone.now();
    const _f = (n) => Tone.Frequency(n, 'midi').toFrequency();
    starSynth.triggerAttackRelease(_f(64), '16n', _now, 0.5);
    starSynth.triggerAttackRelease(_f(69), '16n', _now + 0.06, 0.5);
    starSynth.triggerAttackRelease(_f(76), '16n', _now + 0.13, 0.55);
    starSynth.triggerAttackRelease(_f(81), '8n',  _now + 0.21, 0.65);
    return;
  }
  if (!audioReady) return;
  const now = Tone.now();

  if (type === 'score') {
    scoreSynth.triggerAttackRelease('A4', '16n', now, 0.45);
    scoreSynth.triggerAttackRelease('C#5', '16n', now + 0.1, 0.45);
    scoreSynth.triggerAttackRelease('E5', '16n', now + 0.2, 0.45);
  } else if (type === 'star') {
    // Sparkly upward triplet — pitch climbs with combo, capped to stay pleasant
    const c = Math.min((data || 0), 6);
    const base = 72 + c * 2;  // semitones up, max +12 = octave above
    const f = (n) => Tone.Frequency(n, 'midi').toFrequency();
    starSynth.triggerAttackRelease(f(base), '32n', now, 0.4);
    starSynth.triggerAttackRelease(f(base + 4), '32n', now + 0.04, 0.4);
    starSynth.triggerAttackRelease(f(base + 7), '32n', now + 0.08, 0.4);
  } else if (type === 'combo') {
    // Bell-like rising tone, capped
    const c = Math.min((data || 1), 8);
    const f = Tone.Frequency(60 + c * 2, 'midi').toFrequency();
    comboSynth.triggerAttackRelease(f, '8n', now, 0.5);
  } else if (type === 'milestone') {
    // Triumphant chord
    milestoneSynth.triggerAttackRelease(['C4', 'E4', 'G4', 'C5'], '4n', now, 0.55);
    milestoneSynth.triggerAttackRelease(['G4', 'B4', 'D5', 'G5'], '4n', now + 0.18, 0.5);
  } else if (type === 'gameover') {
    gameOverSynth.triggerAttackRelease('G4', 0.18, now, 0.48);
    gameOverSynth.triggerAttackRelease('D3', 0.24, now + 0.16, 0.42);
    gameOverSynth.triggerAttackRelease('B2', 0.34, now + 0.34, 0.36);
  }
}

function setMusicLevel(level) {
  // 0 = silent, 1 = quiet pad, 2 = stronger pad
  if (!audioReady || !musicBed) return;
  musicLevel = level;
  if (muted) return;
  const targetVol = level === 0 ? -Infinity : (level === 1 ? -28 : -20);
  try { musicBed.volume.rampTo(targetVol, 1.5); } catch {}
}

function startMusic() {
  if (!audioReady || !musicPad) return;
  if (musicLoop) return;  // already running
  try {
    // 4-bar progression of soft pad chords, looped via Tone.Loop
    const chords = [
      ['C3', 'E3', 'G3', 'B3'],
      ['A2', 'C3', 'E3', 'G3'],
      ['F2', 'A2', 'C3', 'E3'],
      ['G2', 'B2', 'D3', 'G3']
    ];
    let step = 0;
    musicLoop = new Tone.Loop((time) => {
      try {
        musicPad.triggerAttackRelease(chords[step % chords.length], '2n', time, 0.4);
      } catch {}
      step++;
    }, 2);  // every 2 seconds
    musicLoop.start(0);
    if (Tone.Transport.state !== 'started') Tone.Transport.start();
  } catch {}
}

function stopMusic() {
  if (musicLoop) {
    try { musicLoop.stop(); musicLoop.dispose(); } catch {}
    musicLoop = null;
  }
}

class RiseScene extends Phaser.Scene {
  constructor() {
    super('RiseScene');
    this.state = 'ready';
    this.score = 0;
    this.bestScore = loadBestScore();
    this.cameraY = 0;
    this.cameraTargetY = 0;
    this.player = null;
    this.hubs = [];
    this.particles = [];
    this.clouds = [];
    this.stars = null;
    this.collectibles = [];        // floating stars to grab mid-air
    this.popups = [];              // floating "+1!", "PERFECT!" text
    this.hubsGenerated = 0;
    this.collectiblesGenerated = 0;
    this.inputHeld = false;
    this.combo = 0;
    this.comboTimer = 0;
    this.shake = 0;
    this.flashAmount = 0;
    this.milestonesHit = new Set();
    this.bigMessage = null;        // { text, life, color }
    this.highestHubReached = 0;
    this.lifeStars = 0;
    this.floatFrames = 0;
  }

  create() {
    riseScene = this;
    this.g = this.add.graphics();
    this.resizeGame();
    this.resetAttractMode();
    if (pendingStartRequest) requestStartGame();

    this.input.on('pointerdown', (pointer) => {
      // Only call preventDefault during gameplay; during menu screens, allow
      // the browser to deliver the click to overlay HTML elements (checkboxes,
      // buttons). Otherwise iOS may swallow the synthesized click.
      if (this.state === 'playing' && pointer.event) pointer.event.preventDefault();
      this.handleGrabStart();
    });

    this.input.on('pointerup', (pointer) => {
      if (this.state === 'playing' && pointer.event) pointer.event.preventDefault();
      this.handleGrabEnd();
    });

    this.input.on('pointerupoutside', (pointer) => {
      if (this.state === 'playing' && pointer.event) pointer.event.preventDefault();
      this.handleGrabEnd();
    });

    this.input.keyboard.on('keydown-SPACE', (event) => {
      event.preventDefault();
      this.handleGrabStart();
    });

    this.input.keyboard.on('keyup-SPACE', (event) => {
      event.preventDefault();
      this.handleGrabEnd();
    });

    this.onWindowResize = () => this.resizeGame();
    window.addEventListener('resize', this.onWindowResize);
  }

  resizeGame() {
    const size = gameSize();
    this.gameWidth = size.width;
    this.gameHeight = size.height;
    // Scale factor: how much bigger the canvas is than the original 420px design.
    // Used to scale hub size, rope length, player size, catch radii, etc. so the
    // game feels chunky on tablets instead of cramped little dots in a big canvas.
    this.S = Math.max(1, Math.min(this.gameWidth / 420, this.gameHeight / 750, 2));
    // Pre-compute scaled physics radii used in many places.
    this.catchR = CATCH_RADIUS * this.S;
    this.magnetR = MAGNETIC_RADIUS * this.S;
    this.starR = STAR_COLLECT_RADIUS * this.S;
    this.playerR = 20 * this.S;
    this.fallThresh = FALL_THRESHOLD * this.S;
    this.scale.resize(size.width, size.height);
    if (this.player) {
      this.player.x = Phaser.Math.Clamp(this.player.x, this.playerR - 2, this.gameWidth - (this.playerR - 2));
    }
  }

  resetAttractMode() {
    this.state = 'ready';
    this.score = 0;
    this.cameraY = 0;
    this.cameraTargetY = 0;
    this.hubs = [];
    this.particles = [];
    this.collectibles = [];
    this.popups = [];
    this.hubsGenerated = 0;
    this.collectiblesGenerated = 0;
    this.inputHeld = false;
    this.combo = 0;
    this.comboTimer = 0;
    this.shake = 0;
    this.flashAmount = 0;
    this.milestonesHit = new Set();
    this.bigMessage = null;
    this.highestHubReached = 0;
    this.hasCaughtFirst = false;
    this.lifeStars = 0;
    this.floatFrames = 0;
    this.player = null;
    this.generateClouds();
    this.generateHubs();
    this.generateCollectiblesUpTo(this.hubs[this.hubs.length - 1].y);
    if (this.bestScore > 0) {
      const el = document.getElementById('ready-best-score');
      el.textContent = '🏆 Best: ' + this.bestScore;
      el.style.display = 'block';
    }
  }

  startGame() {
    initAudio();
    this.state = 'playing';
    this.score = 0;
    this.cameraY = 0;
    this.cameraTargetY = 0;
    this.hubs = [];
    this.particles = [];
    this.collectibles = [];
    this.popups = [];
    this.hubsGenerated = 0;
    this.collectiblesGenerated = 0;
    this.inputHeld = false;
    this.combo = 0;
    this.comboTimer = 0;
    this.shake = 0;
    this.flashAmount = 0;
    this.milestonesHit = new Set();
    this.bigMessage = null;
    this.highestHubReached = 0;
    this.hasCaughtFirst = false;  // no falling/penalty until first catch
    this.lifeStars = 0;
    this.floatFrames = 0;
    document.getElementById('hud-score').textContent = '🏆 0';
    document.getElementById('hud-stars').textContent = '⭐ 0';
    document.getElementById('hud-stars').style.display = 'block';
    document.getElementById('hud-combo').classList.remove('visible');
    this.generateClouds();
    this.generateHubs();
    this.initPlayer();

    // Position player just below the first hub's lowest rope reach.
    // First hub is at gameWidth/2, y=-180, with rope lengths 55/75/95 (isEarly).
    const firstHub = this.hubs[0];
    const longestRope = Math.max(...firstHub.ropes.map(r => r.length));
    this.player.x = firstHub.x;
    this.player.y = firstHub.y + firstHub.radius + longestRope + 12 * (this.S || 1);
    this.player.mood = 'normal';

    this.cameraY = this.player.y - this.gameHeight * 0.7;  // show hub above
    this.cameraTargetY = this.cameraY;
    this.generateCollectiblesUpTo(this.hubs[this.hubs.length - 1].y);
    setMusicLevel(1);
    startMusic();
  }

  createHub(x, y, index) {
    const S = this.S || 1;
    const isEarly = index < 4;
    // Slower speed ramp - cap reached around hub 12-15 instead of 10
    let speed = isEarly ? 0.018 : 0.018 + Math.min((index - 4) * 0.0028, 0.027);
    // Direction flips less often, only after hub 5
    const flipChance = index < 5 ? 0 : Math.min(0.15 + (index - 5) * 0.02, 0.4);
    const dir = index === 0 ? -1 : (index === 1 ? 1 : (Math.random() < flipChance ? -1 : 1));
    const radius = (28 + Math.random() * 14) * S;
    // Keep min 3 ropes through hub 7, then 2-4
    const ropeCount = index < 7 ? 3 : 2 + Math.floor(Math.random() * 3);
    const ropes = [];

    // Hub variants — only after a few warm-up hubs so kids learn the basics first.
    let variant = 'normal';
    if (index >= 5) {
      const r = Math.random();
      if (r < 0.10) variant = 'gold';        // 10% rare bonus hub
      else if (r < 0.20) variant = 'bouncy';  // 10% extra-fast spin
    }
    if (variant === 'bouncy') speed *= 1.6;

    for (let i = 0; i < ropeCount; i++) {
      const angleOffset = (i / ropeCount) * Math.PI * 2;
      const length = (isEarly ? 55 + i * 20 : 40 + Math.random() * 55) * S;
      ropes.push({
        angleOffset,
        length,
        color: ROPE_COLORS[Math.floor(Math.random() * ROPE_COLORS.length)]
      });
    }

    const baseColor = variant === 'gold' ? '#ffd700'
                     : variant === 'bouncy' ? '#ff4d8d'
                     : HUB_COLORS[index % HUB_COLORS.length];

    return {
      x,
      y,
      radius,
      rotation: 0,
      speed: speed * dir,
      ropes,
      color: baseColor,
      variant,
      index,
      uid: index  // permanent monotonic id, never changes when array re-indexes
    };
  }

  generateHubs() {
    const S = this.S || 1;
    // Place first hub at center; clamp by its reach to stay safely on-screen.
    const first = this.createHub(this.gameWidth / 2, -180 * S, 0);
    const reach = this.hubReach(first);
    const minX = reach, maxX = this.gameWidth - reach;
    first.x = (minX > maxX) ? this.gameWidth / 2 : Phaser.Math.Clamp(this.gameWidth / 2, minX, maxX);
    this.hubs.push(first);
    this.hubsGenerated = 1;
    for (let i = 1; i < 8; i++) this.addHub();
  }

  // Compute the maximum horizontal distance from hub center that any part
  // of the swinging system can reach (rope tip + player body).
  hubReach(hub) {
    const S = this.S || 1;
    const maxRopeLen = Math.max(...hub.ropes.map(r => r.length));
    return hub.radius + maxRopeLen + 22 * S;  // 22 = player radius + small buffer
  }

  addHub() {
    const S = this.S || 1;
    const last = this.hubs[this.hubs.length - 1];
    const isEarly = this.hubsGenerated < 4;
    const gapY = (isEarly
      ? 160 + this.hubsGenerated * 10
      : 160 + Math.min(this.hubsGenerated * 3, 60) + Math.random() * 40) * S;
    const xRange = (isEarly ? 60 : 100) * S;
    const proposedX = last.x + (Math.random() - 0.5) * xRange * 2;
    const y = last.y - gapY;
    // Build hub first so we know its rope reach, then clamp x within safe screen bounds.
    const hub = this.createHub(proposedX, y, this.hubsGenerated);
    const reach = this.hubReach(hub);
    const minX = reach;
    const maxX = this.gameWidth - reach;
    if (minX > maxX) {
      // Screen narrower than the hub's swing diameter — center it.
      hub.x = this.gameWidth / 2;
    } else {
      hub.x = Phaser.Math.Clamp(proposedX, minX, maxX);
    }
    this.hubs.push(hub);
    this.hubsGenerated++;
  }

  getRopeEndpoint(hub, rope) {
    const angle = hub.rotation + rope.angleOffset;
    const ax = hub.x + Math.cos(angle) * hub.radius;
    const ay = hub.y + Math.sin(angle) * hub.radius;
    return {
      ax,
      ay,
      ex: ax + Math.cos(angle) * rope.length,
      ey: ay + Math.sin(angle) * rope.length,
      angle
    };
  }

  generateClouds() {
    this.clouds = [];
    for (let i = 0; i < 35; i++) {
      const t = i / 34;
      this.clouds.push({
        x: Math.random() * (this.gameWidth + 60) - 30,
        y: -(t * 8000 + Math.random() * 300),
        w: 60 + Math.random() * 90,
        h: 28 + Math.random() * 32,
        alpha: 0.3 + Math.random() * 0.35,
        depth: 0.6 + Math.random() * 0.5  // 0.6=far/slow, 1.1=near/fast
      });
    }
    // Extra clouds near the start
    for (let i = 0; i < 6; i++) {
      this.clouds.push({
        x: Math.random() * this.gameWidth,
        y: -(i * 120 + 60),
        w: 50 + Math.random() * 70,
        h: 24 + Math.random() * 24,
        alpha: 0.25 + Math.random() * 0.25,
        depth: 0.7 + Math.random() * 0.4
      });
    }
    // Stars at high altitudes (visible after sky darkens)
    this.stars = [];
    for (let i = 0; i < 60; i++) {
      this.stars.push({
        x: Math.random() * this.gameWidth,
        y: -(2500 + Math.random() * 8000),
        r: 0.8 + Math.random() * 1.6,
        twinkle: Math.random() * Math.PI * 2,
        depth: 0.4 + Math.random() * 0.3
      });
    }
  }

  initPlayer() {
    this.player = {
      x: this.gameWidth / 2,
      y: 0,
      vx: 0,
      vy: 0,
      attached: false,
      hubIndex: -1,
      ropeIndex: -1,
      grabCooldown: 0,
      releaseTimer: 0,
      faceDir: 1,
      mood: 'normal'  // 'normal', 'happy', 'scared', 'launch'
    };
  }

  // ---- Collectibles ---------------------------------------------------------
  generateCollectiblesUpTo(targetY) {
    // Generate floating stars between hubs as the world extends
    while (this.collectiblesGenerated < this.hubsGenerated - 1) {
      const i = this.collectiblesGenerated;
      if (i >= 1 && Math.random() < 0.7) {
        // Place 1-3 stars between hub i and hub i+1
        const a = this.hubs.find(h => h.uid === i);
        const b = this.hubs.find(h => h.uid === i + 1);
        if (a && b) {
          const count = 1 + Math.floor(Math.random() * 3);
          for (let k = 0; k < count; k++) {
            const t = (k + 1) / (count + 1);
            const jitterX = (Math.random() - 0.5) * 80;
            const jitterY = (Math.random() - 0.5) * 30;
            const cx = Phaser.Math.Clamp(
              Phaser.Math.Linear(a.x, b.x, t) + jitterX, 30, this.gameWidth - 30
            );
            const cy = Phaser.Math.Linear(a.y, b.y, t) + jitterY;
            this.collectibles.push({
              x: cx,
              y: cy,
              collected: false,
              phase: Math.random() * Math.PI * 2,
              baseY: cy
            });
          }
        }
      }
      this.collectiblesGenerated++;
    }
  }

  collectStar(star) {
    if (star.collected) return;
    star.collected = true;
    this.lifeStars++;
    this.combo += 1;
    this.comboTimer = COMBO_TIMEOUT_FRAMES;
    this.updateStarsHud();
    this.spawnStarBurst(star.x, star.y);
    playSound('star', this.combo);
    if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
    this.popups.push({
      x: star.x,
      y: star.y,
      text: '⭐',
      color: '#ffe066',
      life: 1,
      vy: -1.2,
      size: 22
    });
    this.checkComboMilestone();
  }

  updateStarsHud() {
    const el = document.getElementById('hud-stars');
    el.textContent = '⭐ ' + this.lifeStars;
    if (this.lifeStars > 0) {
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 200);
    }
  }


  spawnStarBurst(x, y) {
    const S = this.S || 1;
    for (let i = 0; i < 12; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (2 + Math.random() * 4) * S;
      this.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1 * S,
        life: 1, decay: 0.04 + Math.random() * 0.03,
        r: (2 + Math.random() * 3) * S,
        color: ['#ffe066', '#fff5b8', '#ffba49'][Math.floor(Math.random() * 3)]
      });
    }
  }

  // ---- Combo & milestones ---------------------------------------------------
  resetCombo() {
    if (this.combo >= 3) {
      // Show "Combo lost" gently
      this.popups.push({
        x: this.player.x,
        y: this.player.y,
        text: 'streak lost',
        color: '#ffffff',
        life: 0.7, vy: -0.6, size: 14
      });
    }
    this.combo = 0;
    this.comboTimer = 0;
  }

  checkComboMilestone() {
    if (this.combo === 3 || this.combo === 5 || this.combo === 8 || this.combo === 12) {
      const labels = { 3: 'NICE!', 5: 'AWESOME!', 8: 'AMAZING!', 12: 'UNREAL!' };
      this.popups.push({
        x: this.player.x,
        y: this.player.y - 30,
        text: labels[this.combo] + ' x' + this.combo,
        color: '#ff6b9d',
        life: 1.4, vy: -0.8, size: 26
      });
      playSound('combo', this.combo);
      this.shake = Math.min(8, 4 + this.combo * 0.3);
      if (navigator.vibrate) try { navigator.vibrate(20); } catch {}
      // Intensify music with combos
      if (this.combo >= 5) setMusicLevel(2);
    }
  }

  checkScoreMilestone() {
    for (const m of MILESTONES) {
      if (this.score >= m && !this.milestonesHit.has(m)) {
        this.milestonesHit.add(m);
        const messages = {
          5: { txt: 'Nice climb!', color: '#6bceff' },
          10: { txt: 'Going strong!', color: '#5eead4' },
          15: { txt: 'Up, up, up!', color: '#a78bfa' },
          25: { txt: 'Sky champion!', color: '#ffe066' },
          40: { txt: 'INCREDIBLE!', color: '#ff8c42' },
          60: { txt: 'LEGENDARY!', color: '#ff6b9d' },
          80: { txt: 'OUT OF THIS WORLD!', color: '#5eead4' },
          100: { txt: '★ HERO OF THE SKY ★', color: '#ffd700' }
        };
        const meta = messages[m];
        this.bigMessage = { text: meta.txt, color: meta.color, life: 2.0 };
        this.flashAmount = 1;
        this.shake = Math.max(this.shake, 12);
        playSound('milestone');
        if (navigator.vibrate) try { navigator.vibrate([30, 40, 60]); } catch {}
      }
    }
  }

  attachPlayer(hubIdx, ropeIdx, silent = false) {
    const hub = this.hubs[hubIdx];
    const rope = hub.ropes[ropeIdx];
    const ep = this.getRopeEndpoint(hub, rope);

    this.player.x = ep.ex;
    this.player.y = ep.ey;
    this.player.attached = true;
    this.player.hubIndex = hubIdx;
    this.player.ropeIndex = ropeIdx;
    this.player.vx = 0;
    this.player.vy = 0;
    this.player.grabCooldown = 12;
    this.player.releaseTimer = 0;
    this.player.airborneCatchTimer = 0;
    this.player.mood = 'happy';
    this.player._moodFrames = 0;

    // First-catch milestone: enables gravity, fall threshold, and missed-catch penalty.
    if (!this.hasCaughtFirst) {
      this.hasCaughtFirst = true;
      // Re-target the camera so the player sits at the normal play position.
      this.cameraTargetY = this.player.y - this.gameHeight * 0.55;
    }

    if (!silent) {
      this.spawnParticles(this.player.x, this.player.y, hub.color);
      // Gold hub gets extra sparkle and +3 life stars
      if (hub.variant === 'gold') {
        this.spawnStarBurst(this.player.x, this.player.y);
        this.spawnStarBurst(this.player.x, this.player.y);
        playSound('goldcatch');
        this.shake = Math.max(this.shake, 9);
        if (navigator.vibrate) try { navigator.vibrate([15, 20, 30]); } catch {}
        this.lifeStars += 3;
        this.updateStarsHud();
        this.popups.push({
          x: this.player.x,
          y: this.player.y - 28,
          text: '+1 ⭐⭐⭐ GOLD!',
          color: '#ffd700',
          life: 1.4, vy: -1.0, size: 24
        });
      } else {
        playSound('catch');
        if (navigator.vibrate) try { navigator.vibrate(15); } catch {}
      }
    }

    // Score & progression: only credit if this is a NEW hub (not one we've reached before)
    if (hub.uid > 0 && hub.uid > this.highestHubReached) {
      this.highestHubReached = hub.uid;
      const earned = 1;
      this.score += earned;
      document.getElementById('hud-score').textContent = '🏆 ' + this.score;

      // Combo grows on every new hub
      this.combo += 1;
      this.comboTimer = COMBO_TIMEOUT_FRAMES;
      if (!silent) this.checkComboMilestone();

      if (!silent) {
        if (hub.variant !== 'gold') {
          this.popups.push({
            x: this.player.x, y: this.player.y - 22,
            text: '+1', color: '#ffffff',
            life: 0.9, vy: -1.0, size: 18
          });
        }
        if (this.score <= 5 || this.score % 3 === 0) playSound('score');
      }
      this.checkScoreMilestone();
    }
  }

  releasePlayer() {
    if (!this.player || !this.player.attached) return;
    const hub = this.hubs[this.player.hubIndex];
    const rope = hub.ropes[this.player.ropeIndex];
    const ep = this.getRopeEndpoint(hub, rope);
    const totalLen = hub.radius + rope.length;
    const tangentSpeed = Math.abs(hub.speed) * totalLen * 1.8;
    const angle = ep.angle + Math.PI / 2 * Math.sign(hub.speed || 1);
    const launchSpeed = Math.min(tangentSpeed * 6, 20);

    this.player.vx = Math.cos(angle) * launchSpeed;
    this.player.vy = Math.sin(angle) * launchSpeed;
    // Gentle upward nudge if mostly going downward — scale by how downward it is
    if (this.player.vy > 3) this.player.vy -= Math.min(this.player.vy * 0.3, 5);

    this.player.attached = false;
    this.player.releaseTimer = 0;
    this.floatFrames = 0;
    this.player.grabCooldown = 8;
    this.player.mood = 'launch';
    playSound('release');
    this.spawnTrail(this.player.x, this.player.y);
  }

  // ---- Landing-guide prediction --------------------------------------------
  // Mirror the release math + airborne integration to predict where the
  // player would land if they let go RIGHT NOW. Returns an array of
  // {x, y} world points (sampled per simulated frame) and the index of
  // the rope/hub it would catch on (or -1 if none within the prediction window).
  predictTrajectory() {
    if (!this.player || !this.player.attached) return null;
    const hub = this.hubs[this.player.hubIndex];
    const rope = hub.ropes[this.player.ropeIndex];
    const ep = this.getRopeEndpoint(hub, rope);
    const totalLen = hub.radius + rope.length;
    const tangentSpeed = Math.abs(hub.speed) * totalLen * 1.8;
    const angle = ep.angle + Math.PI / 2 * Math.sign(hub.speed || 1);
    const launchSpeed = Math.min(tangentSpeed * 6, 20);

    let vx = Math.cos(angle) * launchSpeed;
    let vy = Math.sin(angle) * launchSpeed;
    if (vy > 3) vy -= Math.min(vy * 0.3, 5);

    let x = ep.ex;
    let y = ep.ey;
    const points = [];
    let catchHub = -1;
    let catchRope = -1;
    const maxFrames = 90;  // ~1.5s look-ahead — enough to reach the next hub
    for (let f = 0; f < maxFrames; f++) {
      vy += GRAVITY;
      x += vx;
      y += vy;
      // Soft horizontal clamp to match the actual airborne clamp.
      const pad = this.playerR - 2;
      if (x < pad) { x = pad; vx = 0; }
      else if (x > this.gameWidth - pad) { x = this.gameWidth - pad; vx = 0; }
      points.push({ x, y });

      // Check if this point lands on a rope endpoint
      for (let hi = 0; hi < this.hubs.length; hi++) {
        // Don't re-grab the hub we're predicting from in the first few frames
        if (hi === this.player.hubIndex && f < 12) continue;
        const h = this.hubs[hi];
        if (h.y - this.cameraY > this.gameHeight + 200) continue;
        for (let ri = 0; ri < h.ropes.length; ri++) {
          // Predict the rope's position at frame f (it's also rotating!)
          const futureAngle = h.rotation + h.speed * f + h.ropes[ri].angleOffset;
          const ax = h.x + Math.cos(futureAngle) * h.radius;
          const ay = h.y + Math.sin(futureAngle) * h.radius;
          const rex = ax + Math.cos(futureAngle) * h.ropes[ri].length;
          const rey = ay + Math.sin(futureAngle) * h.ropes[ri].length;
          const dx = rex - x, dy = rey - y;
          if (dx * dx + dy * dy < this.catchR * this.catchR) {
            catchHub = hi;
            catchRope = ri;
            return { points, catchHub, catchRope, catchPoint: { x: rex, y: rey } };
          }
        }
      }

      // Stop if trajectory falls way below screen
      if (y - this.cameraY > this.gameHeight + 300) break;
    }
    return { points, catchHub, catchRope, catchPoint: null };
  }

  handleGrabStart() {
    if (this.state !== 'playing') return;
    initAudio();
    this.inputHeld = true;
    if (this.player.grabCooldown > 0) return;
    if (!this.player.attached) this.tryGrab();
  }

  handleGrabEnd() {
    if (this.state !== 'playing') {
      this.inputHeld = false;
      return;
    }
    this.inputHeld = false;
    if (this.player.attached) this.releasePlayer();
  }


  tryGrab() {
    if (!this.canCatchWhileAirborne()) return;

    let bestDist = this.catchR;
    let bestHub = -1;
    let bestRope = -1;

    for (let hi = 0; hi < this.hubs.length; hi++) {
      const hub = this.hubs[hi];
      if (hub.y - this.cameraY > this.gameHeight + 200) continue;
      for (let ri = 0; ri < hub.ropes.length; ri++) {
        const ep = this.getRopeEndpoint(hub, hub.ropes[ri]);
        const dist = Phaser.Math.Distance.Between(ep.ex, ep.ey, this.player.x, this.player.y);
        if (dist < bestDist) {
          bestDist = dist;
          bestHub = hi;
          bestRope = ri;
        }
      }
    }

    if (bestHub >= 0) this.attachPlayer(bestHub, bestRope);
  }

  spawnParticles(x, y, color) {
    const S = this.S || 1;
    for (let i = 0; i < 10; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (1.5 + Math.random() * 3) * S;
      this.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.03 + Math.random() * 0.03,
        r: (3 + Math.random() * 5) * S,
        color
      });
    }
  }

  spawnTrail(x, y) {
    const S = this.S || 1;
    for (let i = 0; i < 5; i++) {
      this.particles.push({
        x: x + (Math.random() - 0.5) * 10 * S,
        y: y + (Math.random() - 0.5) * 10 * S,
        vx: (Math.random() - 0.5) * 1.5 * S,
        vy: (Math.random() - 0.5) * 1.5 * S,
        life: 0.7,
        decay: 0.05,
        r: (2 + Math.random() * 3) * S,
        color: '#fff'
      });
    }
  }

  update(time, delta) {
    const dt = Math.min(delta / 16.67, 3);

    if (this.state === 'playing') {
      this.updatePlaying(dt);
    } else {
      for (const hub of this.hubs) hub.rotation += hub.speed * 0.3;
      // Let the dead player keep falling for visual effect
      if (this.state === 'gameover' && this.player && !this.player.attached) {
        this.player.vy += GRAVITY;
        this.player.y += this.player.vy * dt;
        this.player.x += this.player.vx * dt * 0.95;  // air drag
      }
      this.updateParticles();
    }

    this.renderScene();
  }

  updatePlaying(dt) {
    for (const hub of this.hubs) hub.rotation += hub.speed;

    // Combo decay
    if (this.combo > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.resetCombo();
    }
    // Music level back to 1 if combo dropped
    if (this.combo < 5 && musicLevel === 2) setMusicLevel(1);

    // Update HUD combo display
    const comboEl = document.getElementById('hud-combo');
    if (this.combo >= 2) {
      comboEl.textContent = 'x' + this.combo;
      comboEl.classList.add('visible');
    } else {
      comboEl.classList.remove('visible');
    }

    if (this.player.grabCooldown > 0) this.player.grabCooldown--;

    if (this.player.attached) {
      // releaseTimer should NOT increment while attached
      const hub = this.hubs[this.player.hubIndex];
      const rope = hub.ropes[this.player.ropeIndex];
      const ep = this.getRopeEndpoint(hub, rope);
      const prevX = this.player.x;
      this.player.x = ep.ex;
      this.player.y = ep.ey;
      // Face direction based on actual screen-x movement
      const dx = ep.ex - prevX;
      if (Math.abs(dx) > 0.4) this.player.faceDir = dx > 0 ? 1 : -1;
      // Mood: 'happy' lingers briefly, then 'normal'
      if (this.player.mood !== 'normal') {
        this.player._moodFrames = (this.player._moodFrames || 0) + 1;
        if (this.player._moodFrames > 30) {
          this.player.mood = 'normal';
          this.player._moodFrames = 0;
        }
      }
    } else {
      // Pre-first-catch: player floats in place, no gravity, no missed-catch penalty,
      // no fall threshold. They just wait for a rope to swing into reach.
      if (this.hasCaughtFirst) {
        this.player.releaseTimer++;
        const prevVy = this.player.vy;
        if (this.floatFrames > 0) {
          this.floatFrames = Math.max(0, this.floatFrames - dt);
          this.player.vy = Math.sin(this.time.now * 0.004) * 0.8;
          this.player.vx *= 0.97;
        } else {
          this.player.vy += GRAVITY;
          // Apex: vy just crossed from negative to positive — spend a star to float
          if (prevVy < 0 && this.player.vy >= 0 && this.lifeStars > 0) {
            this.lifeStars--;
            this.floatFrames = APEX_FLOAT_FRAMES;
            this.updateStarsHud();
            this.flashAmount = 0.35;
            this.spawnStarBurst(this.player.x, this.player.y);
            this.popups.push({ x: this.player.x, y: this.player.y - 30, text: '⭐ FLOAT!', color: '#ffe066', life: 1.4, vy: -0.7, size: 26 });
            playSound('starsave');
            if (navigator.vibrate) try { navigator.vibrate([10, 20, 10]); } catch {}
            // Nudge horizontally toward the nearest rope
            let nudgeDist = Infinity, nudgeEp = null;
            for (const hub of this.hubs) {
              if (hub.y - this.cameraY > this.gameHeight + 200) continue;
              for (const rope of hub.ropes) {
                const ep = this.getRopeEndpoint(hub, rope);
                const d = Math.hypot(ep.ex - this.player.x, ep.ey - this.player.y);
                if (d < nudgeDist) { nudgeDist = d; nudgeEp = ep; }
              }
            }
            if (nudgeEp && nudgeDist > 0) {
              this.player.vx += (nudgeEp.ex - this.player.x) / nudgeDist * 5;
            }
          }
        }

        this.player.x += this.player.vx * dt;
        this.player.y += this.player.vy * dt;
        if (Math.abs(this.player.vx) > 0.5) this.player.faceDir = this.player.vx > 0 ? 1 : -1;

        // Mood
        if (this.floatFrames > 0) this.player.mood = 'happy';
        else if (this.player.vy > 8) this.player.mood = 'scared';
        else if (this.player.mood === 'launch' && this.player.releaseTimer > 25) this.player.mood = 'normal';

        // Continuous flight trail when moving fast
        const S = this.S || 1;
        const speed2 = this.player.vx * this.player.vx + this.player.vy * this.player.vy;
        if (speed2 > 16 * S * S && Math.random() < 0.5) {
          this.particles.push({
            x: this.player.x + (Math.random() - 0.5) * 6 * S,
            y: this.player.y + (Math.random() - 0.5) * 6 * S,
            vx: (Math.random() - 0.5) * 0.3 * S,
            vy: (Math.random() - 0.5) * 0.3 * S,
            life: 0.5,
            decay: 0.06,
            r: (1.5 + Math.random() * 2.5) * S,
            color: '#ffffff'
          });
        }
      }

      let nearestDist = this.magnetR;
      let nearest = null;
      for (let hi = 0; hi < this.hubs.length; hi++) {
        const hub = this.hubs[hi];
        // Skip hubs entirely off-screen below
        if (hub.y - this.cameraY > this.gameHeight + 200) continue;
        for (let ri = 0; ri < hub.ropes.length; ri++) {
          const ep = this.getRopeEndpoint(hub, hub.ropes[ri]);
          const dist = Phaser.Math.Distance.Between(ep.ex, ep.ey, this.player.x, this.player.y);
          if (dist < nearestDist) {
            nearestDist = dist;
            nearest = { ep, hi, ri };
          }
        }
      }

      const canCatch = this.inputHeld;
      if (canCatch && nearest && nearestDist < this.catchR && this.player.grabCooldown <= 0) {
        this.attachPlayer(nearest.hi, nearest.ri);
      } else if (this.hasCaughtFirst && canCatch && nearest && nearestDist < this.magnetR * 0.7) {
        const factor = 0.06;
        this.player.vx += (nearest.ep.ex - this.player.x) * factor;
        this.player.vy += (nearest.ep.ey - this.player.y) * factor;
      }

      if (this.hasCaughtFirst) {
        this.player.x = Phaser.Math.Clamp(this.player.x, this.playerR - 2, this.gameWidth - (this.playerR - 2));
      }
    }

    // Collect stars (always — even while attached, in case rope swings through one)
    for (const star of this.collectibles) {
      if (star.collected) continue;
      const bobY = star.baseY + Math.sin(this.time.now * 0.003 + star.phase) * 4;
      star.y = bobY;
      const dx = star.x - this.player.x;
      const dy = bobY - this.player.y;
      if (dx * dx + dy * dy < this.starR * this.starR) {
        this.collectStar(star);
      }
    }

    // Camera target: when attached, frame the entire swing arc on-screen.
    // The hub is placed near the upper-middle so the rope can swing fully below
    // (and above) without the player going off the bottom or top.
    if (this.player.attached) {
      const hub = this.hubs[this.player.hubIndex];
      const rope = hub.ropes[this.player.ropeIndex];
      const swingReach = hub.radius + rope.length;  // distance from hub to player
      // Position the hub at a screen Y such that hub.y - swingReach (top of arc)
      // and hub.y + swingReach (bottom of arc) both fit within the screen
      // with a small margin for the player's body.
      const margin = 24 * (this.S || 1);  // player radius + small buffer
      // Need: swingReach + margin <= hub_screen_y <= gameHeight - swingReach - margin
      // Pick the upper half of that range so progress feels upward.
      const minHubScreenY = swingReach + margin;
      const maxHubScreenY = this.gameHeight - swingReach - margin;
      let hubScreenY;
      if (minHubScreenY > maxHubScreenY) {
        // Swing too big to fit (very small phone) — center the hub.
        hubScreenY = this.gameHeight / 2;
      } else {
        // Bias toward upper portion (35-45%) so there's still room to climb upward.
        hubScreenY = Phaser.Math.Clamp(this.gameHeight * 0.42, minHubScreenY, maxHubScreenY);
      }
      const desiredCamY = hub.y - hubScreenY;
      this.cameraTargetY = Math.min(this.cameraTargetY, desiredCamY);
    } else {
      const screenTarget = this.gameHeight * 0.55;
      const playerScreenY = this.player.y - this.cameraY;
      if (playerScreenY < screenTarget) {
        this.cameraTargetY = Math.min(this.cameraTargetY, this.player.y - screenTarget);
      }
    }
    // Adaptive lerp: catch up faster when far behind
    const camDelta = this.cameraTargetY - this.cameraY;
    const camLerp = Math.abs(camDelta) > 200 ? 0.2 : 0.1;
    this.cameraY += camDelta * camLerp;

    const topHub = this.hubs[this.hubs.length - 1];
    if (topHub.y - this.cameraY > -this.gameHeight * 0.5) {
      this.addHub();
      this.generateCollectiblesUpTo(topHub.y);
    }

    // Cull hubs far below the camera to keep array bounded.
    while (this.hubs.length > 3 && this.hubs[0].y - this.cameraY > this.gameHeight + 600) {
      if (this.player && this.player.attached && this.player.hubIndex === 0) break;
      this.hubs.shift();
      for (let i = 0; i < this.hubs.length; i++) this.hubs[i].index = i;
      if (this.player && this.player.hubIndex >= 1) {
        this.player.hubIndex -= 1;
      }
    }
    // Cull old collectibles too
    this.collectibles = this.collectibles.filter(c => c.y - this.cameraY < this.gameHeight + 400);

    // Update popups, shake, flash, big message
    for (let i = this.popups.length - 1; i >= 0; i--) {
      const p = this.popups[i];
      p.y += p.vy;
      p.life -= 0.025;
      if (p.life <= 0) this.popups.splice(i, 1);
    }
    if (this.shake > 0) this.shake = Math.max(0, this.shake - 0.6);
    if (this.flashAmount > 0) this.flashAmount = Math.max(0, this.flashAmount - 0.04);
    if (this.bigMessage) {
      this.bigMessage.life -= 0.018;
      if (this.bigMessage.life <= 0) this.bigMessage = null;
    }

    this.updateParticles();

    if (this.hasCaughtFirst && this.player.y - this.cameraY > this.gameHeight + this.fallThresh) {
      this.showGameOver();
    }
  }

  updateParticles() {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.life -= p.decay;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }

  showGameOver() {
    if (this.state === 'gameover') return;
    this.state = 'gameover';
    this.inputHeld = false;
    this.combo = 0;
    document.getElementById('hud-combo').classList.remove('visible');
    setMusicLevel(0);
    stopMusic();
    playSound('gameover');
    if (navigator.vibrate) {
      try { navigator.vibrate([40, 60, 80]); } catch {}
    }
    const isNewBest = this.score > this.bestScore;
    if (isNewBest) {
      this.bestScore = this.score;
      saveBestScore(this.bestScore);
    }

    let msg;
    if (isNewBest && this.score > 0) msg = '🎉 New best! Amazing!';
    else if (this.score >= 20) msg = '🌟 Sky-high climb!';
    else if (this.score >= 10) msg = '💪 Great climbing!';
    else if (this.score >= 5) msg = '🪢 Nice swinging!';
    else if (this.score >= 1) msg = 'Keep practicing!';
    else msg = 'Try again — you got this!';

    document.getElementById('encourage-msg').textContent = msg;
    document.getElementById('final-score').textContent = 'Score: ' + this.score;
    document.getElementById('best-score-display').textContent = 'Best: ' + this.bestScore;
    document.getElementById('screen-gameover').classList.add('active');
    document.getElementById('hud').classList.add('hidden');
  }

  renderScene() {
    this.g.clear();
    this._textPoolUsed = 0;  // reset text counter at start of frame

    // Apply screen shake by translating the graphics context
    let shakeX = 0, shakeY = 0;
    if (this.shake > 0.1) {
      shakeX = (Math.random() - 0.5) * this.shake;
      shakeY = (Math.random() - 0.5) * this.shake;
    }
    this._shakeX = shakeX;
    this._shakeY = shakeY;
    if (this.g.x !== shakeX || this.g.y !== shakeY) {
      this.g.x = shakeX;
      this.g.y = shakeY;
    }

    this.drawSky();
    this.drawStars();
    this.drawClouds();
    this.drawCollectibles();
    for (const hub of this.hubs) this.drawHub(hub);
    // Landing guide: prediction overlay drawn under the player so it doesn't obscure them
    if (guideEnabled && this.state === 'playing' && this.player && this.player.attached) {
      this.drawLandingGuide();
    }
    this.drawParticles();
    if (this.player && this.floatFrames > 0) this.drawFloatAura();
    if (this.player) this.drawPlayer();

    // Flash overlay (drawn last, before HUD popups)
    if (this.flashAmount > 0.02) {
      this.g.fillStyle(0xffffff, this.flashAmount * 0.5);
      this.g.fillRect(-shakeX - 20, -shakeY - 20, this.gameWidth + 40, this.gameHeight + 40);
    }

    this.drawPopups();
    this.drawBigMessage();
    this.recycleText();
  }

  drawFloatAura() {
    const S = this.S || 1;
    const px = this.player.x;
    const py = this.player.y - this.cameraY;
    const t = this.time.now * 0.005;
    const fade = this.floatFrames / APEX_FLOAT_FRAMES;
    const pulse = 0.6 + 0.4 * Math.sin(t);
    this.g.fillStyle(0xffe066, 0.15 * pulse * fade);
    this.g.fillCircle(px, py, 38 * S);
    this.g.fillStyle(0xffd700, 0.1 * pulse * fade);
    this.g.fillCircle(px, py, 52 * S);
    for (let i = 0; i < 3; i++) {
      const angle = t * 2.5 + (i / 3) * Math.PI * 2;
      const sx = px + Math.cos(angle) * 30 * S;
      const sy = py + Math.sin(angle) * 30 * S;
      this.g.fillStyle(0xffffff, 0.8 * fade);
      this.g.fillCircle(sx, sy, 3 * S);
      this.g.fillStyle(0xffe066, 0.6 * fade);
      this.g.fillCircle(sx, sy, 2 * S);
    }
  }

  drawCollectibles() {
    const S = this.S || 1;
    for (const star of this.collectibles) {
      if (star.collected) continue;
      const bobY = star.baseY + Math.sin(this.time.now * 0.003 + star.phase) * 4 * S;
      const sy = bobY - this.cameraY;
      if (sy < -30 || sy > this.gameHeight + 30) continue;
      const pulse = 0.85 + 0.15 * Math.sin(this.time.now * 0.005 + star.phase);
      const r = 8 * S * pulse;
      // Glow
      this.g.fillStyle(0xffe066, 0.25);
      this.g.fillCircle(star.x, sy, r * 2.2);
      this.g.fillStyle(0xffe066, 0.4);
      this.g.fillCircle(star.x, sy, r * 1.5);
      // Star body
      this.g.fillStyle(0xfff5b8, 1);
      this.g.fillCircle(star.x, sy, r);
      this.g.fillStyle(0xffd700, 1);
      this.g.fillCircle(star.x, sy, r * 0.55);
      // Sparkle highlight
      this.g.fillStyle(0xffffff, 0.9);
      this.g.fillCircle(star.x - r * 0.3, sy - r * 0.3, r * 0.25);
    }
  }

  drawLandingGuide() {
    const S = this.S || 1;
    const result = this.predictTrajectory();
    if (!result || result.points.length === 0) return;

    // Color: green if it lands on a rope, soft yellow otherwise
    const lands = result.catchHub >= 0;
    const dotColor = lands ? 0x6ee7b7 : 0xffe066;
    const ringColor = lands ? 0x10b981 : 0xff8c42;

    // Draw dotted preview path: a small circle every few sample points
    const stride = 4;  // every 4 frames of simulation = ~one dot every 67ms
    for (let i = stride; i < result.points.length; i += stride) {
      const p = result.points[i];
      const sx = p.x;
      const sy = p.y - this.cameraY;
      if (sy < -20 || sy > this.gameHeight + 20) continue;
      // Fade dots over distance so the start is bright and the tail dims
      const t = i / result.points.length;
      const alpha = (1 - t) * 0.7 + 0.15;
      const r = (3 - t * 1.2) * S;
      this.g.fillStyle(dotColor, alpha);
      this.g.fillCircle(sx, sy, Math.max(1.2 * S, r));
    }

    // Draw a target marker at the landing point
    if (result.catchPoint) {
      const tx = result.catchPoint.x;
      const ty = result.catchPoint.y - this.cameraY;
      if (ty > -30 && ty < this.gameHeight + 30) {
        const pulse = 0.7 + 0.3 * Math.sin(this.time.now * 0.012);
        this.g.lineStyle(2.5 * S, ringColor, 0.85);
        this.g.strokeCircle(tx, ty, 14 * S * pulse);
        this.g.lineStyle(2 * S, ringColor, 0.5);
        this.g.strokeCircle(tx, ty, 22 * S * pulse);
        // Crosshair
        this.g.lineStyle(2 * S, ringColor, 0.8);
        this.g.beginPath();
        this.g.moveTo(tx - 8 * S, ty); this.g.lineTo(tx + 8 * S, ty);
        this.g.moveTo(tx, ty - 8 * S); this.g.lineTo(tx, ty + 8 * S);
        this.g.strokePath();
      }
    } else if (result.points.length > 0) {
      // No catch — show a small red dot at the last visible point as a warning
      const lastVisible = result.points
        .filter(p => p.y - this.cameraY < this.gameHeight + 20);
      if (lastVisible.length > 0) {
        const p = lastVisible[lastVisible.length - 1];
        const sx = p.x;
        const sy = p.y - this.cameraY;
        if (sy < this.gameHeight + 20) {
          this.g.fillStyle(0xff6b6b, 0.7);
          this.g.fillCircle(sx, sy, 6 * S);
        }
      }
    }
  }

  drawPopups() {
    if (this.popups.length === 0) return;
    for (const p of this.popups) {
      const sy = p.y - this.cameraY;
      if (sy < -30 || sy > this.gameHeight + 30) continue;
      const alpha = Math.min(1, p.life * 1.4);
      this.drawTextOutlined(p.text, p.x, sy, p.size, p.color, alpha);
    }
  }

  drawBigMessage() {
    if (!this.bigMessage) return;
    const m = this.bigMessage;
    const cx = this.gameWidth / 2;
    const cy = this.gameHeight * 0.35;
    const alpha = Math.min(1, m.life * 0.9);
    const scale = 1 + (1 - Math.min(m.life, 1)) * 0.15;
    this.drawTextOutlined(m.text, cx, cy, 34 * scale, m.color, alpha, true);
  }

  drawTextOutlined(text, x, y, size, color, alpha, bold) {
    const S = this.S || 1;
    const scaledSize = size * S;
    if (!this._textPool) this._textPool = [];
    const idx = this._textPoolUsed | 0;
    let txt = this._textPool[idx];
    if (!txt) {
      txt = this.add.text(0, 0, '', {});
      txt.setOrigin(0.5, 0.5);
      this._textPool.push(txt);
    }
    txt.setText(text);
    txt.setStyle({
      fontFamily: '"Bowlby One SC", "DM Sans", sans-serif',
      fontSize: Math.round(scaledSize) + 'px',
      color,
      fontStyle: bold ? '900' : '700',
      stroke: '#1a0030',
      strokeThickness: Math.max(3, Math.round(scaledSize * 0.16))
    });
    txt.setPosition(x + (this._shakeX || 0), y + (this._shakeY || 0));
    txt.setAlpha(alpha);
    txt.setVisible(true);
    txt.setDepth(10);
    this._textPoolUsed = idx + 1;
  }

  recycleText() {
    if (!this._textPool) return;
    const used = this._textPoolUsed || 0;
    for (let i = used; i < this._textPool.length; i++) this._textPool[i].setVisible(false);
  }

  drawSky() {
    const altitude = Math.max(-this.cameraY, 0);
    const progress = Math.min(altitude / 3000, 1);
    const c1 = lerpColorInt(0x87ceeb, 0x1a1a3e, progress);
    const c2 = lerpColorInt(0xffd1dc, 0x000020, progress);
    this.g.fillGradientStyle(c1, c1, c2, c2, 1);
    this.g.fillRect(0, 0, this.gameWidth, this.gameHeight);
  }

  drawStars() {
    if (!this.stars) return;
    const altitude = Math.max(-this.cameraY, 0);
    const skyDarkness = Math.min(Math.max((altitude - 800) / 2000, 0), 1);
    if (skyDarkness <= 0.05) return;
    const time = this.time.now * 0.002;
    for (const star of this.stars) {
      const screenY = star.y - this.cameraY * star.depth;
      if (screenY < -10 || screenY > this.gameHeight + 10) continue;
      const twinkle = 0.55 + 0.45 * Math.sin(time + star.twinkle);
      this.g.fillStyle(0xffffff, skyDarkness * twinkle);
      this.g.fillCircle(star.x, screenY, star.r);
    }
  }

  drawClouds() {
    for (const cloud of this.clouds) {
      const depth = cloud.depth || 1;
      const screenY = cloud.y - this.cameraY * depth;
      if (screenY < -100 || screenY > this.gameHeight + 100) continue;
      this.g.fillStyle(0xffffff, cloud.alpha);
      this.g.fillEllipse(cloud.x, screenY, cloud.w, cloud.h);
      this.g.fillEllipse(cloud.x + cloud.w * 0.25, screenY - cloud.h * 0.25, cloud.w * 0.7, cloud.h * 0.8);
      this.g.fillEllipse(cloud.x - cloud.w * 0.25, screenY - cloud.h * 0.2, cloud.w * 0.6, cloud.h * 0.7);
    }
  }

  drawHub(hub) {
    const S = this.S || 1;
    const sx = hub.x;
    const sy = hub.y - this.cameraY;
    if (sy < -150 || sy > this.gameHeight + 150) return;

    for (let ri = 0; ri < hub.ropes.length; ri++) {
      const rope = hub.ropes[ri];
      const ep = this.getRopeEndpoint(hub, rope);
      const epScreenY = ep.ey - this.cameraY;
      const isActive = this.player && this.player.attached && this.player.hubIndex === hub.index && this.player.ropeIndex === ri;
      const dist = this.player ? Phaser.Math.Distance.Between(ep.ex, ep.ey, this.player.x, this.player.y) : Infinity;
      const isNear = this.player && !this.player.attached && dist < this.magnetR;

      if (isNear) {
        this.g.lineStyle(9 * S, 0xffe066, 0.18);
        this.g.beginPath();
        this.g.moveTo(ep.ax, ep.ay - this.cameraY);
        this.g.lineTo(ep.ex, epScreenY);
        this.g.strokePath();
      }

      this.g.lineStyle((isActive ? 5 : 3.5) * S, hexColor(rope.color), 1);
      this.g.beginPath();
      this.g.moveTo(ep.ax, ep.ay - this.cameraY);
      this.g.lineTo(ep.ex, epScreenY);
      this.g.strokePath();

      this.g.fillStyle(isNear ? 0xffe066 : 0xffffff, isActive || isNear ? 1 : 0.75);
      this.g.fillCircle(ep.ex, epScreenY, (isActive ? 10 : 8) * S);
      this.g.lineStyle(2 * S, hexColor(rope.color), 1);
      this.g.strokeCircle(ep.ex, epScreenY, (isActive ? 10 : 8) * S);
    }

    // Special hub glow
    if (hub.variant === 'gold') {
      const pulse = 0.7 + 0.3 * Math.sin(this.time.now * 0.005);
      this.g.fillStyle(0xffd700, 0.18 * pulse);
      this.g.fillCircle(sx, sy, hub.radius + 16 * S);
      this.g.fillStyle(0xffd700, 0.3 * pulse);
      this.g.fillCircle(sx, sy, hub.radius + 8 * S);
    } else if (hub.variant === 'bouncy') {
      this.g.fillStyle(0xff4d8d, 0.16);
      this.g.fillCircle(sx, sy, hub.radius + 10 * S);
    }

    this.g.fillStyle(hexColor(hub.color), 1);
    this.g.fillCircle(sx, sy, hub.radius);

    // Gold hub: extra gold rim
    if (hub.variant === 'gold') {
      this.g.lineStyle(4 * S, 0xffffff, 0.85);
      this.g.strokeCircle(sx, sy, hub.radius);
      this.g.lineStyle(2 * S, 0xfff5b8, 1);
      this.g.strokeCircle(sx, sy, hub.radius - 4 * S);
    } else {
      this.g.lineStyle(3 * S, 0xffffff, 0.5);
      this.g.strokeCircle(sx, sy, hub.radius);
    }

    this.g.lineStyle(2 * S, 0xffffff, 0.35);
    for (const rope of hub.ropes) {
      const angle = hub.rotation + rope.angleOffset;
      this.g.beginPath();
      this.g.moveTo(sx, sy);
      this.g.lineTo(sx + Math.cos(angle) * hub.radius, sy + Math.sin(angle) * hub.radius);
      this.g.strokePath();
    }

    this.g.fillStyle(hub.variant === 'gold' ? 0xffe066 : 0xffffff, hub.variant === 'gold' ? 1 : 0.7);
    this.g.fillCircle(sx, sy, (hub.variant === 'gold' ? 8 : 6) * S);

    // Star icon on gold hub center
    if (hub.variant === 'gold') {
      this.g.fillStyle(0xffd700, 1);
      this.g.fillCircle(sx, sy, 4 * S);
    }
  }

  drawParticles() {
    for (const p of this.particles) {
      const screenY = p.y - this.cameraY;
      this.g.fillStyle(hexColor(p.color), Phaser.Math.Clamp(p.life, 0, 1));
      this.g.fillCircle(p.x, screenY, p.r);
    }
  }

  drawPlayer() {
    const S   = this.S || 1;
    const px  = this.player.x;
    const waitBob = (this.state === 'playing' && !this.hasCaughtFirst && !this.player.attached)
      ? Math.sin(this.time.now * 0.004) * 4 * S : 0;
    const py  = this.player.y - this.cameraY + waitBob;
    const mood     = this.player.mood || 'normal';
    const attached = !!this.player.attached;
    const fd       = this.player.faceDir || 1;
    const now      = this.time.now;
    const g        = this.g;

    // ── Palette
    const FUR   = 0xf4903c;
    const FURLT = 0xfff0e0;
    const FURDK = 0xc96820;
    const STRIPE= 0xd0641a;
    const PINK  = 0xff9eaa;
    const EYEG  = 0x5aad6a;
    const PUP   = 0x111111;
    const WHT   = 0xffffff;

    // Layout: body is an oval below center; head is a circle above
    const bodyW = 17 * S, bodyH = 20 * S;
    const bodyCX = px, bodyCY = py + 8 * S;
    const headCX = px + fd * 2 * S, headCY = py - 14 * S;
    const headR  = 16 * S;
    const pawR   = 6.5 * S;
    const armH   = 13 * S;

    // ── TAIL (drawn first, behind everything)
    const td  = -fd;
    const tx0 = bodyCX + td * 10 * S, ty0 = bodyCY + bodyH - 6 * S;
    const tcx1 = bodyCX + td * 38 * S, tcy1 = bodyCY + 6 * S;
    const tcx2 = bodyCX + td * 44 * S, tcy2 = bodyCY - 24 * S;
    const tx3  = bodyCX + td * 32 * S, ty3  = bodyCY - 34 * S;
    const bezier = (t, p0, p1, p2, p3) => {
      const mt = 1 - t;
      return mt*mt*mt*p0 + 3*mt*mt*t*p1 + 3*mt*t*t*p2 + t*t*t*p3;
    };
    g.lineStyle(6 * S, FURDK, 0.7);
    g.beginPath(); g.moveTo(tx0, ty0);
    for (let i = 1; i <= 10; i++) { const t = i/10;
      g.lineTo(bezier(t,tx0,tcx1,tcx2,tx3), bezier(t,ty0,tcy1,tcy2,ty3)); }
    g.strokePath();
    g.lineStyle(4.5 * S, FUR, 1);
    g.beginPath(); g.moveTo(tx0, ty0);
    for (let i = 1; i <= 10; i++) { const t = i/10;
      g.lineTo(bezier(t,tx0,tcx1,tcx2,tx3), bezier(t,ty0,tcy1,tcy2,ty3)); }
    g.strokePath();
    // Fluffy tail tip
    g.fillStyle(FURLT, 0.92); g.fillCircle(tx3, ty3, 7.5 * S);
    g.fillStyle(FUR,   0.70); g.fillCircle(tx3, ty3, 6 * S);
    g.fillStyle(FURLT, 0.92); g.fillCircle(tx3, ty3, 3.5 * S);

    // ── BACK LEGS
    if (attached) {
      // Tucked feet showing under body
      g.fillStyle(FUR, 1);
      g.fillCircle(bodyCX - 10 * S, bodyCY + bodyH, pawR * 0.9);
      g.fillCircle(bodyCX + 10 * S, bodyCY + bodyH, pawR * 0.9);
      g.fillStyle(FURLT, 0.8);
      g.fillCircle(bodyCX - 10 * S, bodyCY + bodyH + 1 * S, pawR * 0.45);
      g.fillCircle(bodyCX + 10 * S, bodyCY + bodyH + 1 * S, pawR * 0.45);
    } else {
      const kick = Math.sin(now * 0.011) * 8 * S;
      const legW = 7 * S, legH = 14 * S;
      // Left leg
      g.fillStyle(FURDK, 0.55);
      g.fillRoundedRect(bodyCX - 15 * S + 1, bodyCY + bodyH - 3 * S + 1, legW, legH + kick * 0.6, 5 * S);
      g.fillStyle(FUR, 1);
      g.fillRoundedRect(bodyCX - 15 * S, bodyCY + bodyH - 4 * S, legW, legH + kick * 0.6, 5 * S);
      // Right leg
      g.fillStyle(FURDK, 0.55);
      g.fillRoundedRect(bodyCX + 9 * S + 1, bodyCY + bodyH - 3 * S + 1, legW, legH - kick * 0.6, 5 * S);
      g.fillStyle(FUR, 1);
      g.fillRoundedRect(bodyCX + 9 * S, bodyCY + bodyH - 4 * S, legW, legH - kick * 0.6, 5 * S);
      // Back paws (oval)
      const lyL = bodyCY + bodyH + legH + kick * 0.6 - 4 * S;
      const lyR = bodyCY + bodyH + legH - kick * 0.6 - 4 * S;
      g.fillStyle(FURLT, 1);
      g.fillEllipse(bodyCX - 11 * S, lyL, pawR * 2.4, pawR * 1.5);
      g.fillEllipse(bodyCX + 16 * S, lyR, pawR * 2.4, pawR * 1.5);
      g.lineStyle(1.5 * S, FURDK, 0.65);
      g.strokeEllipse(bodyCX - 11 * S, lyL, pawR * 2.4, pawR * 1.5);
      g.strokeEllipse(bodyCX + 16 * S, lyR, pawR * 2.4, pawR * 1.5);
    }

    // ── BODY (oval torso)
    g.fillStyle(FURDK, 0.35);
    g.fillEllipse(bodyCX + 2 * S, bodyCY + 2 * S, bodyW * 2, bodyH * 2);
    g.fillStyle(FUR, 1);
    g.fillEllipse(bodyCX, bodyCY, bodyW * 2, bodyH * 2);
    g.lineStyle(2 * S, FURDK, 0.85);
    g.strokeEllipse(bodyCX, bodyCY, bodyW * 2, bodyH * 2);
    // Belly / chest
    g.fillStyle(FURLT, 0.68);
    g.fillEllipse(bodyCX + fd * 1.5 * S, bodyCY + 2 * S, bodyW * 1.05, bodyH * 1.25);

    // ── FRONT ARMS
    if (attached) {
      // Arms reach up gripping the rope
      const gripY = headCY - headR - 2 * S;
      g.lineStyle(8 * S, FURDK, 0.5);
      g.beginPath();
      g.moveTo(bodyCX - 13 * S, bodyCY - bodyH + 4 * S);
      g.lineTo(bodyCX - 7 * S, gripY + 4 * S);
      g.moveTo(bodyCX + 13 * S, bodyCY - bodyH + 4 * S);
      g.lineTo(bodyCX + 7 * S, gripY + 4 * S);
      g.strokePath();
      g.lineStyle(7 * S, FUR, 1);
      g.beginPath();
      g.moveTo(bodyCX - 13 * S, bodyCY - bodyH + 4 * S);
      g.lineTo(bodyCX - 7 * S, gripY + 4 * S);
      g.moveTo(bodyCX + 13 * S, bodyCY - bodyH + 4 * S);
      g.lineTo(bodyCX + 7 * S, gripY + 4 * S);
      g.strokePath();
      // Grip paws
      const gLX = bodyCX - 7 * S, gRX = bodyCX + 7 * S;
      g.fillStyle(FURLT, 1); g.fillCircle(gLX, gripY, pawR * 1.1); g.fillCircle(gRX, gripY, pawR * 1.1);
      g.lineStyle(1.8 * S, FURDK, 0.9); g.strokeCircle(gLX, gripY, pawR * 1.1); g.strokeCircle(gRX, gripY, pawR * 1.1);
      // Claws
      for (const bx of [gLX, gRX]) {
        for (let c = -1; c <= 1; c++) {
          g.beginPath();
          g.moveTo(bx + c * 2.5 * S, gripY - pawR * 0.9);
          g.lineTo(bx + c * 3 * S, gripY - pawR - 5.5 * S);
          g.strokePath();
        }
      }
    } else {
      // Dangling arms with gentle swing
      const swing = Math.sin(now * 0.009) * 4 * S;
      const aLX = bodyCX - bodyW - 5 * S + swing, aRX = bodyCX + bodyW + 5 * S - swing;
      const aY  = bodyCY + armH;
      g.lineStyle(8 * S, FURDK, 0.45);
      g.beginPath();
      g.moveTo(bodyCX - bodyW + 2 * S, bodyCY - 4 * S); g.lineTo(aLX, aY);
      g.moveTo(bodyCX + bodyW - 2 * S, bodyCY - 4 * S); g.lineTo(aRX, aY);
      g.strokePath();
      g.lineStyle(7 * S, FUR, 1);
      g.beginPath();
      g.moveTo(bodyCX - bodyW + 2 * S, bodyCY - 4 * S); g.lineTo(aLX, aY);
      g.moveTo(bodyCX + bodyW - 2 * S, bodyCY - 4 * S); g.lineTo(aRX, aY);
      g.strokePath();
      // Front paws
      g.fillStyle(FURLT, 1); g.fillCircle(aLX, aY, pawR); g.fillCircle(aRX, aY, pawR);
      g.lineStyle(1.5 * S, FURDK, 0.8); g.strokeCircle(aLX, aY, pawR); g.strokeCircle(aRX, aY, pawR);
    }

    // ── HEAD (drawn over body so it pops forward)
    g.fillStyle(FURDK, 0.3);
    g.fillCircle(headCX + 2 * S, headCY + 2 * S, headR);
    g.fillStyle(FUR, 1);
    g.fillCircle(headCX, headCY, headR);
    g.lineStyle(2 * S, FURDK, 0.88);
    g.strokeCircle(headCX, headCY, headR);
    // Face patch
    g.fillStyle(FURLT, 0.52);
    g.fillEllipse(headCX + fd * 2 * S, headCY + 4 * S, 19 * S, 22 * S);

    // ── EARS
    const earData = [
      [headCX - 15*S, headCY - 8*S, headCX - 5*S, headCY - 10*S, headCX - 11*S, headCY - 27*S,
       headCX - 13*S, headCY - 10*S, headCX - 7*S, headCY - 11*S, headCX - 11*S, headCY - 23*S],
      [headCX + 5*S, headCY - 10*S, headCX + 15*S, headCY - 8*S, headCX + 11*S, headCY - 27*S,
       headCX + 7*S, headCY - 11*S, headCX + 13*S, headCY - 10*S, headCX + 11*S, headCY - 23*S]
    ];
    for (const [x1,y1,x2,y2,x3,y3, ix1,iy1,ix2,iy2,ix3,iy3] of earData) {
      g.fillStyle(FUR, 1);
      g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.lineTo(x3,y3); g.closePath(); g.fillPath();
      g.lineStyle(1.5*S, FURDK, 0.88);
      g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.lineTo(x3,y3); g.closePath(); g.strokePath();
      g.fillStyle(PINK, 0.82);
      g.beginPath(); g.moveTo(ix1,iy1); g.lineTo(ix2,iy2); g.lineTo(ix3,iy3); g.closePath(); g.fillPath();
    }

    // ── TABBY FOREHEAD STRIPES
    g.lineStyle(2.2 * S, STRIPE, 0.5);
    for (let i = -1; i <= 1; i++) {
      g.beginPath();
      g.arc(headCX + i * 5 * S, headCY - headR + 3 * S, 4 * S, Math.PI + 0.35, Math.PI * 2 - 0.35, false);
      g.strokePath();
    }

    // ── EYES
    const ex  = fd * 1.5 * S;
    const eLX = headCX + ex - 6.5 * S, eRX = headCX + ex + 6.5 * S;
    const eY  = headCY - 4 * S;
    const eR  = (mood === 'scared' || mood === 'launch') ? 6.5 * S : 5.5 * S;

    g.fillStyle(WHT, 1); g.fillCircle(eLX, eY, eR); g.fillCircle(eRX, eY, eR);

    if (mood === 'happy') {
      g.fillStyle(EYEG, 1); g.fillCircle(eLX, eY, eR - 0.5*S); g.fillCircle(eRX, eY, eR - 0.5*S);
      g.fillStyle(PUP, 1);
      g.fillEllipse(eLX, eY + 0.5*S, 2.2*S, (eR - 0.5*S) * 1.65);
      g.fillEllipse(eRX, eY + 0.5*S, 2.2*S, (eR - 0.5*S) * 1.65);
      // Squint crescent
      g.fillStyle(WHT, 1);
      g.fillRect(eLX - eR, eY - eR, eR * 2, eR); g.fillRect(eRX - eR, eY - eR, eR * 2, eR);
    } else if (mood === 'scared' || mood === 'launch') {
      g.fillStyle(EYEG, 1); g.fillCircle(eLX, eY, eR - 0.5*S); g.fillCircle(eRX, eY, eR - 0.5*S);
      g.fillStyle(PUP, 1); g.fillCircle(eLX, eY, 2.8*S); g.fillCircle(eRX, eY, 2.8*S);
    } else {
      g.fillStyle(EYEG, 1); g.fillCircle(eLX, eY, eR - 0.5*S); g.fillCircle(eRX, eY, eR - 0.5*S);
      g.fillStyle(PUP, 1);
      g.fillEllipse(eLX, eY, 2.2*S, (eR - 0.5*S) * 1.7);
      g.fillEllipse(eRX, eY, 2.2*S, (eR - 0.5*S) * 1.7);
    }
    // Eye shine
    g.fillStyle(WHT, 0.92);
    g.fillCircle(eLX + 2*S, eY - 2*S, 1.8*S); g.fillCircle(eRX + 2*S, eY - 2*S, 1.8*S);

    // ── NOSE
    const nX = headCX + ex, nY = headCY + 5 * S;
    g.fillStyle(PINK, 1);
    g.beginPath(); g.moveTo(nX, nY-3*S); g.lineTo(nX-3.5*S, nY+2.5*S); g.lineTo(nX+3.5*S, nY+2.5*S);
    g.closePath(); g.fillPath();

    // ── MOUTH
    g.lineStyle(1.8 * S, FURDK, 0.9);
    if (mood === 'happy') {
      g.beginPath(); g.arc(nX, nY + 5*S, 6*S, 0.15, Math.PI - 0.15, false); g.strokePath();
    } else if (mood === 'scared' || mood === 'launch') {
      g.fillStyle(0x6b2222, 1); g.fillCircle(nX, nY+6*S, 3.5*S);
      g.lineStyle(1.5*S, FURDK, 0.8); g.strokeCircle(nX, nY+6*S, 3.5*S);
    } else {
      g.beginPath();
      g.moveTo(nX-6*S, nY+3*S); g.lineTo(nX-2*S, nY+6.5*S);
      g.lineTo(nX, nY+4*S); g.lineTo(nX+2*S, nY+6.5*S); g.lineTo(nX+6*S, nY+3*S);
      g.strokePath();
    }

    // ── WHISKERS
    g.lineStyle(1.3 * S, FURDK, 0.35);
    for (let w = 0; w < 3; w++) {
      const wy = nY + (w - 1) * 4 * S;
      g.beginPath(); g.moveTo(nX-3*S, wy); g.lineTo(nX-22*S, wy + (w-1)*3*S); g.strokePath();
      g.beginPath(); g.moveTo(nX+3*S, wy); g.lineTo(nX+22*S, wy + (w-1)*3*S); g.strokePath();
    }
  }
}

const initialSize = gameSize();
const phaserGame = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game-root',
  width: initialSize.width,
  height: initialSize.height,
  backgroundColor: '#87ceeb',
  scale: {
    mode: Phaser.Scale.NONE,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  render: {
    antialias: true,
    pixelArt: false
  },
  scene: RiseScene
});

function showPlayingUi() {
  document.getElementById('screen-ready').classList.remove('active');
  document.getElementById('screen-gameover').classList.remove('active');
  document.getElementById('hud').classList.remove('hidden');
}

function requestStartGame(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const now = performance.now();
  if (lastStartRequestAt && now - lastStartRequestAt < 250) return;
  lastStartRequestAt = now;

  if (!riseScene) {
    pendingStartRequest = true;
    return;
  }

  pendingStartRequest = false;
  initAudio();
  riseScene.startGame();
  showPlayingUi();
}

document.getElementById('mute-btn').addEventListener('click', (event) => {
  event.preventDefault();
  event.stopPropagation();
  setMuted(!muted);
});

// Landing-guide checkbox: shared preference between title and game-over screens,
// persisted in localStorage. Toggling either checkbox updates the global flag,
// the other checkbox, and immediately affects the next run.
const guideToggleReady = document.getElementById('ready-guide-toggle');
const guideToggleGameover = document.getElementById('gameover-guide-toggle');
function setGuidePref(on) {
  guideEnabled = !!on;
  saveGuidePref(guideEnabled);
  guideToggleReady.checked = guideEnabled;
  guideToggleGameover.checked = guideEnabled;
}
// Initialize from storage
guideEnabled = loadGuidePref();
guideToggleReady.checked = guideEnabled;
guideToggleGameover.checked = guideEnabled;
guideToggleReady.addEventListener('change', () => setGuidePref(guideToggleReady.checked));
guideToggleGameover.addEventListener('change', () => setGuidePref(guideToggleGameover.checked));

const startButton = document.getElementById('btn-start');
const restartButton = document.getElementById('btn-restart');
startButton.addEventListener('pointerup', requestStartGame);
startButton.addEventListener('click', requestStartGame);
restartButton.addEventListener('pointerup', requestStartGame);
restartButton.addEventListener('click', requestStartGame);

document.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
</script>
